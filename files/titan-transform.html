<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TITAN PROTOCOL — Human Transformation System</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --colossal: #ff4400;
  --armor: #667788;
  --beast: #cc8822;
  --speed: #44aaff;
  --dark: #6600cc;
  --light: #ffffaa;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden; background:#000;
  font-family:'Rajdhani',sans-serif;
  touch-action:none;
}
#videoEl { display:none; }

/* Canvas stack */
#videoCanvas, #bgCanvas, #fxCanvas, #overlayCanvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
#videoCanvas  { z-index:1; }
#bgCanvas     { z-index:2; }
#fxCanvas     { z-index:3; }
#overlayCanvas{ z-index:4; }

/* Three.js canvas */
#threeCanvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  z-index:5; pointer-events:none;
}

/* Loading */
#loadScreen {
  position:fixed; inset:0; z-index:200;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px;
}
.load-eyemark {
  font-size:clamp(60px,12vw,120px);
  filter:drop-shadow(0 0 30px #ff4400) drop-shadow(0 0 80px #ff2200);
  animation:eyePulse 1.5s ease-in-out infinite;
}
@keyframes eyePulse {
  0%,100%{transform:scaleY(1);filter:drop-shadow(0 0 30px #ff4400) drop-shadow(0 0 80px #ff2200)}
  50%{transform:scaleY(0.85);filter:drop-shadow(0 0 60px #ff6600) drop-shadow(0 0 160px #ff4400)}
}
.load-title {
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(32px,8vw,72px);
  letter-spacing:12px;
  color:#fff;
  text-shadow:0 0 20px rgba(255,80,0,0.9),0 0 60px rgba(255,40,0,0.5);
  text-transform:uppercase;
}
.load-subtitle {
  font-size:11px; letter-spacing:5px;
  color:rgba(255,150,80,0.6); text-transform:uppercase;
}
.load-bar { width:280px; height:2px; background:rgba(255,100,0,0.15); overflow:hidden; }
.load-bar::after {
  content:''; display:block; height:100%;
  background:linear-gradient(90deg,transparent,#ff6600,#ffaa00,transparent);
  animation:lscan 1.3s ease-in-out infinite;
}
@keyframes lscan { from{transform:translateX(-100%)} to{transform:translateX(200%)} }
#loadMsg { font-size:11px; letter-spacing:3px; color:rgba(255,120,60,0.5); text-transform:uppercase; }

/* HUD */
#hud {
  position:fixed; z-index:10;
  top:20px; left:0; right:0;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:0 24px; pointer-events:none;
}
.hud-brand {
  font-family:'Black Han Sans',sans-serif;
  font-size:20px; letter-spacing:6px; color:rgba(255,255,255,0.85);
  text-shadow:0 0 20px rgba(255,80,0,0.8);
}
.hud-status { font-size:9px; letter-spacing:4px; color:rgba(255,150,80,0.5); margin-top:4px; }
.hud-right { text-align:right; }
.hud-fps { font-size:9px; letter-spacing:3px; color:rgba(100,200,255,0.35); }

/* Titan Name Display */
#titanName {
  position:fixed; z-index:10;
  bottom:100px; left:50%; transform:translateX(-50%);
  text-align:center; pointer-events:none;
}
.titan-type {
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(18px,5vw,42px);
  letter-spacing:8px; text-transform:uppercase;
  color:#fff;
  text-shadow:0 0 30px currentColor, 0 0 80px currentColor;
  opacity:0; transition:opacity 0.4s, color 0.4s, text-shadow 0.4s;
  white-space:nowrap;
}
.titan-sub {
  font-size:10px; letter-spacing:5px; text-transform:uppercase;
  color:rgba(255,255,255,0.4);
  margin-top:6px; opacity:0; transition:opacity 0.4s;
}
.titan-type.visible, .titan-sub.visible { opacity:1; }

/* Gesture Strip */
#gestureStrip {
  position:fixed; z-index:10; bottom:30px;
  left:50%; transform:translateX(-50%);
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  padding:0 16px; pointer-events:none;
}
.g-chip {
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:rgba(255,200,150,0.28);
  border:1px solid rgba(255,150,80,0.1);
  padding:4px 9px; white-space:nowrap;
}

/* Power indicators */
#powerBar {
  position:fixed; z-index:10;
  right:18px; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; gap:8px;
  pointer-events:none;
}
.pb-dot {
  width:8px; height:8px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.04);
  transition:all 0.35s;
}
.pb-dot.lit {
  transform:scale(1.7);
  box-shadow:0 0 8px var(--dc,#fff), 0 0 16px var(--dc,#fff);
  background:var(--dc,#fff);
}

/* Screen flash overlay */
#flashOverlay {
  position:fixed; inset:0; z-index:15;
  background:#fff; opacity:0; pointer-events:none;
  transition:opacity 0.15s;
}

/* Transformation progress arc */
#transformHUD {
  position:fixed; z-index:10;
  top:50%; left:24px; transform:translateY(-50%);
  pointer-events:none; opacity:0; transition:opacity 0.3s;
}
#transformHUD.active { opacity:1; }
#txLabel { font-size:9px; letter-spacing:3px; color:rgba(255,180,80,0.7); text-transform:uppercase; margin-bottom:6px; }
</style>
</head>
<body>

<div id="loadScreen">
  <div class="load-eyemark">👁</div>
  <div class="load-title">TITAN PROTOCOL</div>
  <div class="load-subtitle">Human Metamorphosis Engine</div>
  <div class="load-bar"></div>
  <div id="loadMsg">Initializing neural scan...</div>
</div>

<video id="videoEl" playsinline autoplay muted></video>

<canvas id="videoCanvas"></canvas>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<canvas id="overlayCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div id="flashOverlay"></div>

<div id="hud">
  <div>
    <div class="hud-brand">TITAN</div>
    <div class="hud-status" id="hudStatus">Scanning form...</div>
  </div>
  <div class="hud-right">
    <div class="hud-fps" id="hudFps">— fps</div>
  </div>
</div>

<div id="titanName">
  <div class="titan-type" id="titanType"></div>
  <div class="titan-sub" id="titanSub"></div>
</div>

<div id="transformHUD">
  <div id="txLabel">TRANSFORMING</div>
  <canvas id="txArc" width="50" height="50"></canvas>
</div>

<div id="powerBar">
  <div class="pb-dot" id="pb-colossal" style="--dc:#ff4400"></div>
  <div class="pb-dot" id="pb-armor"    style="--dc:#99aabb"></div>
  <div class="pb-dot" id="pb-beast"    style="--dc:#cc8822"></div>
  <div class="pb-dot" id="pb-speed"    style="--dc:#44aaff"></div>
  <div class="pb-dot" id="pb-dark"     style="--dc:#9933ff"></div>
  <div class="pb-dot" id="pb-light"    style="--dc:#ffffaa"></div>
</div>

<div id="gestureStrip">
  <div class="g-chip">🤲 Slow Open → Colossal</div>
  <div class="g-chip">✊ Fist → Armor</div>
  <div class="g-chip">⚡ Fast Swipe → Beast</div>
  <div class="g-chip">✌ Two Fingers → Speed</div>
  <div class="g-chip">🙏 Hands Together → Dark</div>
  <div class="g-chip">🙌 Palms Up → Light</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  TITAN PROTOCOL — Cinematic Transformation Engine
//  Three canvas layers + Three.js + MediaPipe Hands
// ═══════════════════════════════════════════════════════════

// ─── CANVAS REFS ────────────────────────────────────────────
const videoEl = document.getElementById('videoEl');
const vcC = document.getElementById('videoCanvas');
const bgC = document.getElementById('bgCanvas');
const fxC = document.getElementById('fxCanvas');
const ovC = document.getElementById('overlayCanvas');

const vcX = vcC.getContext('2d');
const bgX = bgC.getContext('2d');
const fxX = fxC.getContext('2d');
const ovX = ovC.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
let globalTime = 0, frameCount = 0;
let fps = 60, lastFrameTime = performance.now();

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  [vcC, bgC, fxC, ovC].forEach(c => { c.width = W; c.height = H; });
}
resize();
window.addEventListener('resize', resize);

// ─── THREE.JS SETUP ─────────────────────────────────────────
const threeCanvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
window.addEventListener('resize', () => { renderer.setSize(W, H); tCam.aspect = W/H; tCam.updateProjectionMatrix(); });

const tScene = new THREE.Scene();
const tCam = new THREE.PerspectiveCamera(60, W/H, 0.1, 1000);
tCam.position.z = 5;

// ─── STATE ──────────────────────────────────────────────────
let handsData = [];
let activeTitan = 'none';
let prevTitan  = 'none';
let transformProgress = 0; // 0→1
let transforming = false;
let shakeAmt = 0;
let titanLocked = false; // once transformed, hold until gesture changes

// Smooth landmark buffers
const smBufs = [[],[]];
function smoothLM(raw, idx) {
  if (!smBufs[idx].length) smBufs[idx] = raw.map(l=>({...l}));
  const s = smBufs[idx];
  for (let i=0;i<raw.length&&i<s.length;i++){
    s[i].x+=(raw[i].x-s[i].x)*0.28;
    s[i].y+=(raw[i].y-s[i].y)*0.28;
    s[i].z+=(raw[i].z-s[i].z)*0.28;
  }
  return s;
}

// Coord helpers
const sx = lm => (1-lm.x)*W;
const sy = lm =>    lm.y *H;

// ═══════════════════════════════════════════════════════════
//  GESTURE DETECTION ENGINE
// ═══════════════════════════════════════════════════════════
const GE = (() => {
  let velBuf = []; const VL = 10;
  let lastPos = null;
  let slowCount = 0;

  function ext(lms,tip,pip){ return lms[tip].y < lms[pip].y-0.02; }
  function fing(lms){
    return [
      lms[4].x < lms[3].x-0.02,
      ext(lms,8,6), ext(lms,12,10), ext(lms,16,14), ext(lms,20,18)
    ];
  }
  function palm(lms){ return {x:1-lms[9].x, y:lms[9].y}; }

  return {
    detect(hands) {
      if (!hands.length) return 'none';
      const lmsArr = hands.map(h=>h.lms);

      // Velocity from primary hand
      const p = palm(lmsArr[0]);
      if (lastPos) {
        const v = Math.hypot(p.x-lastPos.x,p.y-lastPos.y);
        velBuf.push(v); if(velBuf.length>VL) velBuf.shift();
      }
      lastPos = p;
      const avgVel = velBuf.length ? velBuf.reduce((a,b)=>a+b)/velBuf.length : 0;

      // TWO HAND gestures
      if (lmsArr.length >= 2) {
        const w0 = lmsArr[0][0], w1 = lmsArr[1][0];
        const wd = Math.hypot((1-w0.x)-(1-w1.x), w0.y-w1.y);
        const p0 = palm(lmsArr[0]), p1 = palm(lmsArr[1]);

        // Palms close → Dark Titan
        if (wd < 0.15) return 'dark';

        // Check both hands opening slowly → Colossal
        const f0 = fing(lmsArr[0]), f1 = fing(lmsArr[1]);
        const ext0 = f0.filter(Boolean).length, ext1 = f1.filter(Boolean).length;
        if (ext0 >= 3 && ext1 >= 3 && avgVel < 0.008 && wd > 0.25) return 'colossal';

        // Both palms up → Light
        if (lmsArr[0][9].y < lmsArr[0][0].y && lmsArr[1][9].y < lmsArr[1][0].y &&
            ext0 >= 3 && ext1 >= 3) return 'light';
      }

      const lms = lmsArr[0];
      const f = fing(lms);
      const extC = f.filter(Boolean).length;

      // Fast movement → Beast
      if (avgVel > 0.03) return 'beast';

      // Fist → Armor
      if (extC <= 1 && !f[1]) return 'armor';

      // Two fingers → Speed
      if (f[1] && f[2] && !f[3] && !f[4]) return 'speed';

      // Open hand slow → Colossal (single hand fallback)
      if (extC >= 4 && avgVel < 0.006) return 'colossal';

      // Open hand → Light (single hand)
      if (extC >= 4 && lms[9].y < lms[0].y) return 'light';

      return 'idle';
    }
  };
})();

// ═══════════════════════════════════════════════════════════
//  PARTICLE ENGINE
// ═══════════════════════════════════════════════════════════
class Particles {
  constructor(max=500){ this.pool=[]; this.max=max; }
  spawn(o){
    const n=Math.min(o.count||1, this.max-this.pool.length);
    for(let i=0;i<n;i++){
      const a=(o.angle??Math.random()*Math.PI*2)+(Math.random()-0.5)*(o.spread??Math.PI*2);
      const spd=(o.speed??0.003)*(0.5+Math.random());
      this.pool.push({
        x:o.x+(Math.random()-0.5)*(o.sx||0),
        y:o.y+(Math.random()-0.5)*(o.sy||0),
        vx:Math.cos(a)*spd+(o.wx||0),
        vy:Math.sin(a)*spd+(o.wy||-0.001),
        life:1, decay:o.decay||(0.01+Math.random()*0.015),
        size:o.size||(1+Math.random()*3),
        col:o.col||'rgba(255,255,255,$a)',
        glow:o.glow??false, glowCol:o.glowCol||o.col,
        grav:o.grav||0, shape:o.shape||'circle',
        rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.08,
        grow:o.grow??false,
      });
    }
  }
  draw(ctx){
    this.pool=this.pool.filter(p=>p.life>0.01);
    for(const p of this.pool){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav;
      p.life-=p.decay; p.rot+=p.rotV;
      const a=Math.max(0,p.life);
      const sz=p.grow?p.size*(1.5-p.life*0.5):p.size*a;
      if(sz<0.05) continue;
      const col=p.col.replace('$a',a.toFixed(2));
      if(p.glow){ ctx.shadowBlur=14; ctx.shadowColor=(p.glowCol||p.col).replace('$a','1'); }
      if(p.shape==='spark'){
        ctx.save(); ctx.translate(p.x*W,p.y*H); ctx.rotate(p.rot);
        ctx.beginPath(); ctx.moveTo(-sz*3,0); ctx.lineTo(sz*3,0);
        ctx.strokeStyle=col; ctx.lineWidth=Math.max(0.3,sz*0.4); ctx.stroke();
        ctx.restore();
      } else if(p.shape==='shard'){
        ctx.save(); ctx.translate(p.x*W,p.y*H); ctx.rotate(p.rot);
        ctx.beginPath(); ctx.moveTo(0,-sz*2); ctx.lineTo(sz*0.6,sz); ctx.lineTo(-sz*0.6,sz); ctx.closePath();
        ctx.fillStyle=col; ctx.fill(); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x*W,p.y*H,Math.max(0.1,sz),0,Math.PI*2);
        ctx.fillStyle=col; ctx.fill();
      }
      if(p.glow) ctx.shadowBlur=0;
    }
  }
  clear(){ this.pool=[]; }
  get count(){ return this.pool.length; }
}
const PS = new Particles(400);

// ═══════════════════════════════════════════════════════════
//  VIDEO FEED + BODY SILHOUETTE PROCESSOR
// ═══════════════════════════════════════════════════════════
let videoReady = false;
const offscreen = document.createElement('canvas');
const offX = offscreen.getContext('2d');
let bodyPixels = null; // will hold ImageData

function processVideoFrame() {
  if (!videoReady) return;
  offscreen.width = videoEl.videoWidth || 640;
  offscreen.height = videoEl.videoHeight || 480;
  offX.save();
  offX.translate(offscreen.width, 0);
  offX.scale(-1, 1);
  offX.drawImage(videoEl, 0, 0);
  offX.restore();
}

// ═══════════════════════════════════════════════════════════
//  THREE.JS VFX OBJECTS (Titan-specific 3D elements)
// ═══════════════════════════════════════════════════════════
const threeVFX = {
  colossal: null, armor: null, beast: null,
  speed: null, dark: null, light: null,
  active: null,

  buildColossal() {
    const g = new THREE.Group();
    // Steam rings
    const rings = [];
    for(let i=0;i<6;i++){
      const geo = new THREE.TorusGeometry(0.8+i*0.4, 0.05, 6, 32);
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(1, 0.4-i*0.05, 0),
        transparent: true, opacity: 0.6
      });
      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = Math.PI/2;
      g.add(m); rings.push({m, i});
    }
    // Core heat sphere
    const cGeo = new THREE.SphereGeometry(0.3,16,16);
    const cMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8});
    const core = new THREE.Mesh(cGeo, cMat);
    g.add(core);
    tScene.add(g);
    return {g, rings, core, type:'colossal'};
  },

  buildArmor() {
    const g = new THREE.Group();
    const shards = [];
    for(let i=0;i<20;i++){
      const geo = new THREE.OctahedronGeometry(0.08+Math.random()*0.12);
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(0.4+Math.random()*0.3, 0.45+Math.random()*0.2, 0.5+Math.random()*0.2),
        transparent: true, opacity: 0.8, wireframe: Math.random()<0.3
      });
      const m = new THREE.Mesh(geo, mat);
      m.position.set((Math.random()-0.5)*3,(Math.random()-0.5)*3,(Math.random()-0.5)*1);
      m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
      g.add(m); shards.push({m, ox:m.position.x, oy:m.position.y});
    }
    tScene.add(g);
    return {g, shards, type:'armor'};
  },

  buildBeast() {
    const g = new THREE.Group();
    // Energy tendrils
    const lines = [];
    for(let i=0;i<16;i++){
      const pts=[];
      for(let j=0;j<8;j++) pts.push(new THREE.Vector3((Math.random()-0.5)*4,(Math.random()-0.5)*4,(Math.random()-0.5)*0.5));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({color:new THREE.Color(0.9,0.55,0.1),transparent:true,opacity:0.7});
      const l = new THREE.Line(geo,mat);
      g.add(l); lines.push({l,geo});
    }
    // Aura sphere
    const aGeo = new THREE.SphereGeometry(1.2,16,16);
    const aMat = new THREE.MeshBasicMaterial({color:0xcc6600,wireframe:true,transparent:true,opacity:0.3});
    const aura = new THREE.Mesh(aGeo,aMat);
    g.add(aura);
    tScene.add(g);
    return {g, lines, aura, type:'beast'};
  },

  buildSpeed() {
    const g = new THREE.Group();
    const afterimages = [];
    for(let i=0;i<5;i++){
      const geo = new THREE.PlaneGeometry(2.5,4);
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(0.2+i*0.1, 0.6+i*0.06, 1),
        transparent:true, opacity: 0.12-i*0.02, side:THREE.DoubleSide
      });
      const m = new THREE.Mesh(geo,mat);
      m.position.x = -i * 0.4;
      g.add(m); afterimages.push(m);
    }
    // Speed lines
    const slPts = [];
    for(let i=0;i<60;i++) slPts.push(new THREE.Vector3((Math.random()-0.5)*8,(Math.random()-0.5)*6,0));
    const slGeo = new THREE.BufferGeometry().setFromPoints(slPts);
    const slMat = new THREE.PointsMaterial({color:0x88ccff,size:0.04,transparent:true,opacity:0.6});
    const speedLines = new THREE.Points(slGeo,slMat);
    g.add(speedLines);
    tScene.add(g);
    return {g, afterimages, speedLines, type:'speed'};
  },

  buildDark() {
    const g = new THREE.Group();
    const voids = [];
    for(let i=0;i<8;i++){
      const geo = new THREE.SphereGeometry(0.15+Math.random()*0.2,8,8);
      const mat = new THREE.MeshBasicMaterial({color:new THREE.Color(0.3+Math.random()*0.2,0,0.5+Math.random()*0.3),transparent:true,opacity:0.5});
      const m = new THREE.Mesh(geo,mat);
      m.position.set((Math.random()-0.5)*2.5,(Math.random()-0.5)*2.5,0);
      g.add(m); voids.push({m, phase:Math.random()*Math.PI*2});
    }
    // Dark rings
    const rings=[];
    for(let i=0;i<5;i++){
      const geo = new THREE.TorusGeometry(0.6+i*0.35, 0.02, 6, 40);
      const mat = new THREE.MeshBasicMaterial({color:new THREE.Color(0.4,0,0.8),transparent:true,opacity:0.5});
      const m = new THREE.Mesh(geo,mat);
      m.rotation.x = Math.random()*Math.PI; m.rotation.y = Math.random()*Math.PI;
      g.add(m); rings.push({m, rotX:(Math.random()-0.5)*0.03, rotY:(Math.random()-0.5)*0.03});
    }
    tScene.add(g);
    return {g, voids, rings, type:'dark'};
  },

  buildLight() {
    const g = new THREE.Group();
    const feathers = [];
    for(let i=0;i<12;i++){
      const geo = new THREE.ConeGeometry(0.04, 0.3, 4);
      const mat = new THREE.MeshBasicMaterial({color:new THREE.Color(1,1,0.8),transparent:true,opacity:0.6});
      const m = new THREE.Mesh(geo,mat);
      const ang = (i/12)*Math.PI*2;
      m.position.set(Math.cos(ang)*1.8, Math.sin(ang)*1.8, 0);
      m.rotation.z = ang + Math.PI/2;
      g.add(m); feathers.push({m, baseAng:ang, phase:Math.random()*Math.PI*2});
    }
    // Halo
    const hGeo = new THREE.TorusGeometry(1.3,0.05,8,64);
    const hMat = new THREE.MeshBasicMaterial({color:0xffffaa,transparent:true,opacity:0.8});
    const halo = new THREE.Mesh(hGeo,hMat);
    halo.rotation.x = Math.PI/2;
    g.add(halo);
    tScene.add(g);
    return {g, feathers, halo, type:'light'};
  },

  get(type) {
    if(!this[type]) this[type] = this['build'+type.charAt(0).toUpperCase()+type.slice(1)]?.();
    return this[type];
  },

  update(type, progress, t) {
    const obj = this.get(type);
    if(!obj) return;
    // Hide others
    ['colossal','armor','beast','speed','dark','light'].forEach(n => {
      if(this[n]) this[n].g.visible = (n===type);
    });
    if(!obj.g.visible) return;

    obj.g.visible = true;

    switch(type) {
      case 'colossal':
        obj.rings.forEach(({m,i},idx) => {
          m.scale.setScalar(progress * (1+Math.sin(t*2+i)*0.1));
          m.rotation.z = t*0.5*(i%2?1:-1);
          m.material.opacity = progress * (0.7-idx*0.08);
          m.position.y = -1.5 + idx*0.4 + Math.sin(t*3+idx)*0.2;
        });
        obj.core.scale.setScalar(progress*(1+Math.sin(t*4)*0.2));
        obj.core.material.opacity = progress*0.9;
        break;

      case 'armor':
        obj.shards.forEach(({m,ox,oy},i) => {
          const phase = i/20;
          const arrive = Math.max(0,Math.min(1,(progress-phase*0.4)*3));
          m.position.x = ox*(1-arrive)*(1+Math.sin(t+i));
          m.position.y = oy*(1-arrive)*(1+Math.cos(t+i));
          m.rotation.x += 0.03*(1-arrive);
          m.rotation.y += 0.04*(1-arrive);
          m.material.opacity = arrive * 0.85;
        });
        break;

      case 'beast':
        obj.lines.forEach(({l,geo},i) => {
          if(Math.random()<0.4){
            const pts=[];
            for(let j=0;j<8;j++) pts.push(new THREE.Vector3(
              (Math.random()-0.5)*4*progress,
              (Math.random()-0.5)*4*progress,
              (Math.random()-0.5)*0.5
            ));
            geo.setFromPoints(pts);
            geo.attributes.position.needsUpdate=true;
          }
          l.material.opacity = progress*0.7;
        });
        obj.aura.rotation.y = t*0.8; obj.aura.rotation.x = t*0.3;
        obj.aura.scale.setScalar(progress*(1+Math.sin(t*3)*0.08));
        obj.aura.material.opacity = progress*0.3;
        break;

      case 'speed':
        obj.afterimages.forEach((m,i) => {
          m.position.x = -i*0.5*progress;
          m.material.opacity = progress*(0.15-i*0.025);
        });
        obj.speedLines.rotation.z = t*0.5;
        obj.speedLines.material.opacity = progress*0.6;
        break;

      case 'dark':
        obj.voids.forEach(({m,phase},i) => {
          m.position.x = Math.cos(t*0.5+phase)*1.5;
          m.position.y = Math.sin(t*0.7+phase)*1.5;
          m.scale.setScalar(progress*(0.8+Math.sin(t*2+phase)*0.2));
          m.material.opacity = progress*0.55;
        });
        obj.rings.forEach(({m,rotX,rotY}) => {
          m.rotation.x += rotX; m.rotation.y += rotY;
          m.material.opacity = progress*0.55;
        });
        break;

      case 'light':
        obj.feathers.forEach(({m,baseAng,phase},i) => {
          const ang = baseAng + Math.sin(t*0.8+phase)*0.3 + t*0.2;
          const r = 1.8 + Math.sin(t*1.2+phase)*0.3;
          m.position.set(Math.cos(ang)*r, Math.sin(ang)*r, 0);
          m.rotation.z = ang + Math.PI/2;
          m.material.opacity = progress*0.7;
        });
        obj.halo.scale.setScalar(progress*(1+Math.sin(t*2)*0.05));
        obj.halo.rotation.z = t*0.3;
        obj.halo.material.opacity = progress*0.9;
        break;
    }
  },

  hideAll() {
    ['colossal','armor','beast','speed','dark','light'].forEach(n => {
      if(this[n]) this[n].g.visible = false;
    });
  }
};

// ── COLOSSAL: Steam + shockwave + heat ──────────────────────
let colossalPhase = 0;
const shockwaves = [];
function renderColossal(progress, t) {
  colossalPhase += 0.05;
  const cx = W/2, cy = H*0.55;

  // Launch shockwave rings
  if(frameCount % 18 === 0 && progress > 0.3) {
    shockwaves.push({r:20, life:1, cx, cy, col:'rgba(255,120,40,'});
  }
  shockwaves.forEach((sw,i) => {
    sw.r += 5; sw.life -= 0.02;
    fxX.beginPath();
    fxX.arc(sw.cx, sw.cy, sw.r, 0, Math.PI*2);
    fxX.strokeStyle = sw.col+(sw.life*0.5).toFixed(2)+')';
    fxX.lineWidth = 3; fxX.shadowBlur=12; fxX.shadowColor='#ff6600';
    fxX.stroke(); fxX.shadowBlur=0;
  });
  shockwaves.splice(0, shockwaves.filter(s=>s.life<=0).length);

  // Ground crack
  if(progress > 0.5) {
    const gc = fxX.createRadialGradient(cx, H, 0, cx, H, 300*progress);
    gc.addColorStop(0,'rgba(255,100,0,0.3)'); gc.addColorStop(0.3,'rgba(255,60,0,0.1)'); gc.addColorStop(1,'rgba(0,0,0,0)');
    fxX.fillStyle=gc; fxX.fillRect(0,H-60,W,60);
    // Crack lines
    for(let c=0;c<8;c++) {
      const ang = Math.PI + (c/8-0.5)*1.5;
      fxX.beginPath(); fxX.moveTo(cx,H);
      let px=cx, py=H;
      for(let s=0;s<6;s++){
        px += Math.cos(ang+(Math.random()-0.5)*0.4)*50*progress;
        py += Math.sin(ang+(Math.random()-0.5)*0.4)*30*progress;
        fxX.lineTo(px,py);
      }
      fxX.strokeStyle=`rgba(255,${80+c*20},0,${progress*0.6})`;
      fxX.lineWidth=1.5; fxX.stroke();
    }
  }

  // Heat body glow (around person silhouette)
  const bg = fxX.createRadialGradient(cx,cy*0.9,0,cx,cy*0.9,220*progress);
  bg.addColorStop(0,`rgba(255,200,100,${progress*0.18})`);
  bg.addColorStop(0.4,`rgba(255,60,0,${progress*0.08})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.beginPath(); fxX.arc(cx,cy*0.9,220*progress,0,Math.PI*2); fxX.fill();

  // Steam particles upward
  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.08, y:0.6+(Math.random()-0.5)*0.1,
    count:Math.ceil(5*progress), speed:0.003, angle:-Math.PI/2, spread:0.9,
    wx:(Math.random()-0.5)*0.002, wy:-0.004,
    decay:0.008, size:6+Math.random()*8, grow:true,
    col:Math.random()<0.6?'rgba(255,180,60,$a)':'rgba(120,80,50,$a)',
    glow:true, glowCol:'#ff6600',
  });

  // White heat flash at peak
  if(progress > 0.85) {
    const fl = fxX.createRadialGradient(cx,cy*0.8,0,cx,cy*0.8,300);
    fl.addColorStop(0,`rgba(255,255,240,${(progress-0.85)*0.4})`);
    fl.addColorStop(1,'rgba(255,255,200,0)');
    fxX.fillStyle=fl; fxX.fillRect(0,0,W,H);
  }
}

// ── ARMOR: Plates forming ─────────────────────────────────
let armorPhase=0;
function renderArmor(progress, t) {
  armorPhase+=0.04;
  const cx=W/2, cy=H*0.5;

  // Steel body glow
  const bg=fxX.createRadialGradient(cx,cy,0,cx,cy,180*progress);
  bg.addColorStop(0,`rgba(150,180,200,${progress*0.12})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.beginPath(); fxX.arc(cx,cy,180*progress,0,Math.PI*2); fxX.fill();

  // Floating metal shards → attaching to body
  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.4, y:0.5+(Math.random()-0.5)*0.4,
    count:Math.ceil(4*progress), speed:0.002,
    angle:Math.atan2(0.5-(Math.random()*0.5),0.5-(Math.random()*0.5)),
    spread:0.4, decay:0.015, size:4+Math.random()*5,
    col:Math.random()<0.5?'rgba(160,180,200,$a)':'rgba(100,120,140,$a)',
    glow:false, shape:'shard',
  });

  // Impact rings
  for(let r=0;r<3;r++){
    const rad = 70+r*50+Math.sin(armorPhase*3+r)*15;
    fxX.beginPath(); fxX.arc(cx,cy,rad,0,Math.PI*2);
    fxX.strokeStyle=`rgba(180,200,220,${progress*(0.3-r*0.08)})`;
    fxX.lineWidth=1.5+r; fxX.stroke();
  }
}

// ── BEAST: Fur burst + aura ───────────────────────────────
let beastPhase=0;
const beastTrail=[];
function renderBeast(progress, t) {
  beastPhase+=0.06;
  const cx=W/2, cy=H*0.5;

  // Golden aura
  const bg=fxX.createRadialGradient(cx,cy,0,cx,cy,200*progress);
  bg.addColorStop(0,`rgba(220,140,20,${progress*0.15})`);
  bg.addColorStop(0.5,`rgba(180,80,0,${progress*0.08})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.beginPath(); fxX.arc(cx,cy,200*progress,0,Math.PI*2); fxX.fill();

  // Jagged energy spikes
  for(let s=0;s<12;s++){
    const ang=(s/12)*Math.PI*2+beastPhase*0.3;
    const len=60+Math.random()*80*progress;
    const mx=cx+Math.cos(ang+0.3)*len*0.6+(Math.random()-0.5)*20;
    const my=cy+Math.sin(ang+0.3)*len*0.6+(Math.random()-0.5)*20;
    fxX.beginPath(); fxX.moveTo(cx,cy);
    fxX.quadraticCurveTo(mx,my, cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
    fxX.strokeStyle=`rgba(${200+Math.floor(Math.random()*55)},${100+Math.floor(Math.random()*60)},0,${progress*0.6})`;
    fxX.lineWidth=2; fxX.shadowBlur=10; fxX.shadowColor='#cc6600'; fxX.stroke(); fxX.shadowBlur=0;
  }

  // Aggressive particles
  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.12, y:0.5+(Math.random()-0.5)*0.15,
    count:Math.ceil(6*progress), speed:0.005, spread:Math.PI*2,
    decay:0.02, size:2+Math.random()*4,
    col:Math.random()<0.6?'rgba(220,140,20,$a)':'rgba(180,80,0,$a)',
    glow:true, glowCol:'#cc6600', shape:Math.random()<0.5?'spark':'circle',
  });
}

// ── SPEED: Motion blur + afterimages ─────────────────────
let speedPhase=0;
function renderSpeed(progress, t) {
  speedPhase+=0.08;
  const cx=W/2, cy=H*0.5;

  // Speed lines
  for(let l=0;l<20;l++){
    const y=H*0.1+Math.random()*H*0.8;
    const len=80+Math.random()*200*progress;
    const x=Math.random()*W;
    const grad=fxX.createLinearGradient(x,y,x+len,y);
    grad.addColorStop(0,'rgba(100,180,255,0)');
    grad.addColorStop(0.5,`rgba(150,220,255,${progress*0.5})`);
    grad.addColorStop(1,'rgba(100,180,255,0)');
    fxX.beginPath(); fxX.moveTo(x,y); fxX.lineTo(x+len,y);
    fxX.strokeStyle=grad; fxX.lineWidth=0.8; fxX.stroke();
  }

  // Electric field
  const bg=fxX.createRadialGradient(cx,cy,0,cx,cy,160*progress);
  bg.addColorStop(0,`rgba(100,180,255,${progress*0.08})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.beginPath(); fxX.arc(cx,cy,160*progress,0,Math.PI*2); fxX.fill();

  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.05, y:0.5+(Math.random()-0.5)*0.1,
    count:Math.ceil(5*progress), speed:0.006, angle:Math.random()<0.5?0:Math.PI, spread:0.5,
    decay:0.025, size:1+Math.random()*2,
    col:'rgba(140,210,255,$a)', glow:true, glowCol:'#44aaff', shape:'spark',
  });
}

// ── DARK: Void energy + gravity ──────────────────────────
let darkPhase=0;
function renderDark(progress, t) {
  darkPhase+=0.035;
  const cx=W/2, cy=H*0.5;

  // Screen darkening
  bgX.fillStyle=`rgba(0,0,0,${progress*0.06})`;
  bgX.fillRect(0,0,W,H);

  // Void field (absorbs light)
  const bg=fxX.createRadialGradient(cx,cy,0,cx,cy,220*progress);
  bg.addColorStop(0,`rgba(30,0,60,${progress*0.2})`);
  bg.addColorStop(0.5,`rgba(10,0,30,${progress*0.15})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.fillRect(0,0,W,H);

  // Gravity distortion rings (inward pull)
  for(let r=0;r<6;r++){
    const rad=30+r*40 + ((darkPhase*50*(r+1)) % 200);
    const a=Math.max(0,0.6-rad/250)*progress;
    fxX.beginPath(); fxX.arc(cx,cy,rad,0,Math.PI*2);
    fxX.strokeStyle=`rgba(${80+r*10},0,${160+r*12},${a})`;
    fxX.lineWidth=1.5; fxX.stroke();
  }

  // Void tendrils
  for(let i=0;i<10;i++){
    const ang=(i/10)*Math.PI*2+darkPhase*0.5;
    const len=60+Math.random()*100*progress;
    fxX.beginPath(); fxX.moveTo(cx,cy);
    fxX.quadraticCurveTo(
      cx+Math.cos(ang+0.5)*len*0.5+(Math.random()-0.5)*30,
      cy+Math.sin(ang+0.5)*len*0.5+(Math.random()-0.5)*30,
      cx+Math.cos(ang)*len, cy+Math.sin(ang)*len
    );
    fxX.strokeStyle=`rgba(${100+Math.floor(Math.random()*60)},0,${180+Math.floor(Math.random()*60)},${progress*0.5})`;
    fxX.lineWidth=1+Math.random(); fxX.stroke();
  }

  // Glowing eyes effect
  if(progress > 0.5) {
    const eyeY=H*0.35, eyeOff=30;
    [[cx-eyeOff,eyeY],[cx+eyeOff,eyeY]].forEach(([ex,ey]) => {
      const eg=fxX.createRadialGradient(ex,ey,0,ex,ey,20);
      eg.addColorStop(0,`rgba(200,100,255,${(progress-0.5)*1.2})`);
      eg.addColorStop(0.4,`rgba(100,0,200,${(progress-0.5)*0.6})`);
      eg.addColorStop(1,'rgba(0,0,0,0)');
      fxX.fillStyle=eg; fxX.beginPath(); fxX.ellipse(ex,ey,20,12,0,0,Math.PI*2); fxX.fill();
    });
  }

  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.15, y:0.5+(Math.random()-0.5)*0.2,
    count:Math.ceil(3*progress), speed:0.001, spread:Math.PI*2,
    decay:0.007, size:2+Math.random()*3,
    col:Math.random()<0.6?'rgba(100,0,200,$a)':'rgba(40,0,80,$a)',
    glow:true, glowCol:'#6600cc',
  });
}

// ── LIGHT: Divine glow + feathers ────────────────────────
let lightPhase=0;
const lightWaves=[];
function renderLight(progress, t) {
  lightPhase+=0.025;
  const cx=W/2, cy=H*0.5;

  // Expanding divine waves
  if(frameCount%25===0 && progress>0.2) lightWaves.push({r:10,life:1,cx,cy});

    g.addColorStop(0.8,`rgba(255,255,200,${w.life*0.15*progress})`);
    g.addColorStop(1,'rgba(255,255,200,0)');
    fxX.strokeStyle=`rgba(255,255,180,${w.life*0.4*progress})`;
    fxX.lineWidth=2; fxX.shadowBlur=15; fxX.shadowColor='#ffffaa';
    fxX.stroke(); fxX.shadowBlur=0;
  });
  lightWaves.splice(0,lightWaves.filter(w=>w.life<=0).length);

  // Radiant body aura
  const bg=fxX.createRadialGradient(cx,cy*0.85,0,cx,cy*0.85,280*progress);
  bg.addColorStop(0,`rgba(255,255,220,${progress*0.15})`);
  bg.addColorStop(0.4,`rgba(255,220,100,${progress*0.06})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  fxX.fillStyle=bg; fxX.fillRect(0,0,W,H);

  // Floating feather/cross sparks
  PS.spawn({
    x:0.5+(Math.random()-0.5)*0.2, y:0.5+(Math.random()-0.5)*0.3,
    count:Math.ceil(4*progress), speed:0.0015, angle:-Math.PI/2, spread:1.8,
    wy:-0.002, wx:(Math.random()-0.5)*0.001,
    decay:0.005, size:2+Math.random()*3,
    col:Math.random()<0.7?'rgba(255,255,200,$a)':'rgba(200,255,240,$a)',
    glow:true, glowCol:'#ffffaa', shape:'star',
  });

  // Halo ring
  const hc=fxX.createRadialGradient(cx,H*0.3,0,cx,H*0.3,60*progress);
  hc.addColorStop(0,'rgba(255,255,220,0)');
  hc.addColorStop(0.7,`rgba(255,255,180,${progress*0.4})`);
  hc.addColorStop(1,'rgba(255,255,180,0)');
  fxX.fillStyle=hc; fxX.beginPath(); fxX.ellipse(cx,H*0.3,70*progress,20*progress,0,0,Math.PI*2); fxX.fill();
}

  armor:   { name:'ARMOR FORM',     sub:'Steel • Impact • Plates',        col:'#99aabb', pid:'pb-armor'    },
  beast:   { name:'BEAST FORM',     sub:'Fury • Power • Instinct',        col:'#cc8822', pid:'pb-beast'    },

  dark:    { name:'VOID FORM',      sub:'Darkness • Gravity • Abyss',     col:'#9933ff', pid:'pb-dark'     },
  light:   { name:'SPIRIT FORM',    sub:'Radiance • Divine • Ascendant',  col:'#ffffaa', pid:'pb-light'    },

let lastTitanMeta = null;
function updateHUD(titan) {
  const meta = TITANS[titan] || TITANS.none;
  if(meta===lastTitanMeta) return;
  lastTitanMeta = meta;

  const tn = document.getElementById('titanType');
  const ts = document.getElementById('titanSub');
  tn.textContent = meta.name;
  tn.style.color = meta.col;
  tn.style.textShadow = `0 0 30px ${meta.col}, 0 0 80px ${meta.col}`;
  ts.textContent = meta.sub;
  tn.classList.toggle('visible', !!meta.name);
  ts.classList.toggle('visible', !!meta.name);

  document.querySelectorAll('.pb-dot').forEach(d=>d.classList.remove('lit'));
  if(meta.pid) document.getElementById(meta.pid)?.classList.add('lit');

  document.getElementById('hudStatus').textContent = meta.name || 'Scanning form...';
}

// Transformation arc canvas
const txArc = document.getElementById('txArc').getContext('2d');
function drawTransformArc(progress) {
  txArc.clearRect(0,0,50,50);
  txArc.beginPath(); txArc.arc(25,25,20,0,Math.PI*2);
  txArc.strokeStyle='rgba(255,150,60,0.15)'; txArc.lineWidth=2; txArc.stroke();
  txArc.beginPath(); txArc.arc(25,25,20,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
  const col = TITANS[activeTitan]?.col || '#ff6600';
  txArc.strokeStyle=col; txArc.lineWidth=2.5;
  txArc.shadowBlur=8; txArc.shadowColor=col; txArc.stroke(); txArc.shadowBlur=0;
}

// Screen flash
function triggerFlash(col='#ffffff', opacity=0.6) {
  const fl = document.getElementById('flashOverlay');
  fl.style.background = col;
  fl.style.opacity = opacity;
  setTimeout(()=>{ fl.style.transition='opacity 0.4s'; fl.style.opacity='0'; },80);
}

// ═══════════════════════════════════════════════════════════
//  VIDEO FRAME RENDERING WITH TITAN OVERLAY
// ═══════════════════════════════════════════════════════════
function renderVideoWithEffect(titan, progress) {
  if(!videoReady) return;
  const vw=videoEl.videoWidth||640, vh=videoEl.videoHeight||480;
  if(!vw||!vh) return;

  vcX.save();

  // Mirror video
  vcX.translate(W,0); vcX.scale(-1,1);

  // Base video composite
  vcX.globalAlpha = 1;
  vcX.drawImage(videoEl,0,0,W,H);

  // Titan overlay blend modes
  if(progress > 0.1) {
    switch(titan) {
      case 'colossal':
        vcX.globalCompositeOperation='screen';
        vcX.globalAlpha=progress*0.25;
        vcX.fillStyle=`rgba(255,120,0,1)`;
        vcX.fillRect(0,0,W,H);
        break;
      case 'armor':
        vcX.globalCompositeOperation='luminosity';
        vcX.globalAlpha=progress*0.3;
        vcX.fillStyle='rgba(140,160,180,1)'; vcX.fillRect(0,0,W,H);
        break;
      case 'beast':
        vcX.globalCompositeOperation='multiply';
        vcX.globalAlpha=progress*0.4;
        vcX.fillStyle='rgba(180,100,20,1)'; vcX.fillRect(0,0,W,H);
        break;
      case 'speed':
        vcX.globalCompositeOperation='screen';
        vcX.globalAlpha=progress*0.2;
        vcX.fillStyle='rgba(60,140,255,1)'; vcX.fillRect(0,0,W,H);
        break;
      case 'dark':
        vcX.globalCompositeOperation='multiply';
        vcX.globalAlpha=progress*0.7;
        vcX.fillStyle='rgba(20,0,40,1)'; vcX.fillRect(0,0,W,H);
        break;
      case 'light':
        vcX.globalCompositeOperation='screen';
        vcX.globalAlpha=progress*0.35;
        vcX.fillStyle='rgba(255,255,200,1)'; vcX.fillRect(0,0,W,H);
        break;
    }
  }

  vcX.restore();
  vcX.globalAlpha=1; vcX.globalCompositeOperation='source-over';
}

// ═══════════════════════════════════════════════════════════
//  MAIN RENDER LOOP
// ═══════════════════════════════════════════════════════════
let lastTX = 'none';
let txHoldTimer = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now-lastFrameTime)/16.67,3);
  lastFrameTime = now;
  globalTime += dt*0.016; frameCount++;

  // FPS
  fps = fps*0.92 + (60/dt)*0.08;
  if(frameCount%30===0) {
    document.getElementById('hudFps').textContent = Math.round(fps)+' fps';
    PS.max = fps < 35 ? 150 : fps < 45 ? 250 : 420;
  }

  // Gesture detect
  const gestureRaw = GE.detect(handsData);

  // Smooth transition — hold for 0.4s before switching
  if(gestureRaw !== lastTX) {
    txHoldTimer++;
    if(txHoldTimer > 8) {
      if(gestureRaw !== activeTitan) {
        prevTitan = activeTitan;
        activeTitan = gestureRaw;
        transformProgress = 0;
        transforming = true;
        if(activeTitan !== 'none' && activeTitan !== 'idle') {
          triggerFlash(TITANS[activeTitan]?.col||'#ffffff', 0.3);
          shakeAmt = 10;
        }
      }
      lastTX = gestureRaw; txHoldTimer = 0;
    }
  } else { txHoldTimer = 0; }

  // Transform progress
  if(transforming) {
    transformProgress = Math.min(1, transformProgress + 0.025*dt);
    if(transformProgress >= 1) { transforming=false; }
  }

  // Idle decay
  if(activeTitan==='none'||activeTitan==='idle') {
    transformProgress = Math.max(0, transformProgress-0.04*dt);
  }

  // Camera shake
  shakeAmt *= 0.88;
  const sx2 = (Math.random()-0.5)*shakeAmt;
  const sy2 = (Math.random()-0.5)*shakeAmt;

  // ── CLEAR / COMPOSITE ───────────────────────────────────
  bgX.fillStyle='rgba(0,0,0,0.05)'; bgX.fillRect(0,0,W,H);
  fxX.clearRect(0,0,W,H);
  ovX.clearRect(0,0,W,H);

  fxX.save(); fxX.translate(sx2,sy2);

  // ── VIDEO FEED ──────────────────────────────────────────
  vcX.clearRect(0,0,W,H);
  renderVideoWithEffect(activeTitan, transformProgress);

  // ── POWER RENDERERS ─────────────────────────────────────
  const p = transformProgress, t = globalTime;
  if(p > 0.01) {
    switch(activeTitan) {
      case 'colossal': renderColossal(p, t); break;
      case 'armor':    renderArmor(p, t);    break;
      case 'beast':    renderBeast(p, t);    break;
      case 'speed':    renderSpeed(p, t);    break;
      case 'dark':     renderDark(p, t);     break;
      case 'light':    renderLight(p, t);    break;
    }
  }

  // ── PARTICLES ────────────────────────────────────────────
  PS.draw(fxX);
  fxX.restore();

  // ── THREE.JS ─────────────────────────────────────────────
  if(p>0.05 && activeTitan!=='none'&&activeTitan!=='idle') {
    threeVFX.update(activeTitan, p, t);
  } else {
    threeVFX.hideAll();
  }
  renderer.render(tScene, tCam);

  // ── HUD ──────────────────────────────────────────────────
  updateHUD(activeTitan);
  const txHudEl = document.getElementById('transformHUD');
  txHudEl.classList.toggle('active', transforming && p<0.95);
  if(transforming) drawTransformArc(p);

  // ── DEBUG HANDS ──────────────────────────────────────────
  if(handsData.length>0) {
    handsData.forEach(hd => {
      const lms=hd.lms;
      [8,12,16,20,4].forEach(tip=>{
        const tdot_x=sx(lms[tip]), tdot_y=sy(lms[tip]);
        ovX.beginPath(); ovX.arc(tdot_x,tdot_y,3,0,Math.PI*2);
        ovX.fillStyle='rgba(255,255,255,0.3)'; ovX.fill();
      });
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  MEDIAPIPE INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  const msg = t => { document.getElementById('loadMsg').textContent = t; };

  msg('Loading hand tracking model...');
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.65 });
  hands.onResults(res => {
    handsData=[];
    if(!res.multiHandLandmarks) return;
    res.multiHandLandmarks.forEach((lms,i)=>{
      const hand=res.multiHandedness?.[i]?.label||'Right';
      handsData.push({ lms:smoothLM(lms,i), hand });
    });
  });

  msg('Requesting camera access...');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
    });
    videoEl.srcObject = stream;
    await new Promise(r=>{ videoEl.onloadedmetadata=r; });
    videoEl.play();
    videoReady = true;
  } catch(e) {
    msg('⚠ Camera denied — allow access and reload.'); return;
  }

  msg('Awakening titan protocol...');
  const cam = new Camera(videoEl, {
    onFrame: async()=>{ await hands.send({image:videoEl}); },
    width:640, height:480
  });
  await cam.start();

  msg('PROTOCOL ONLINE');
  setTimeout(()=>{
    const el=document.getElementById('loadScreen');
    el.style.transition='opacity 1.2s'; el.style.opacity='0';
    setTimeout(()=>el.style.display='none',1300);
  },700);
}

// ── KICK OFF ──────────────────────────────────────────────
animate(performance.now());
init().catch(e=>{ console.error(e); document.getElementById('loadMsg').textContent='Error: '+e.message; });
</script>
