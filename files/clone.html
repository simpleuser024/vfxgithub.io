<!DOCTYPE html>
<html>
<head>
  <title>Shadow Clone Hand Detection</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      text-align: center;
      color: white;
      font-family: sans-serif;
    }

    canvas {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scaleX(-1); /* FIX mirror */
    }

    video {
      display: none;
    }

    #status {
      position: absolute;
      top: 10px;
      width: 100%;
      font-size: 24px;
      z-index: 10;
    }
  </style>
</head>

<body>

<h2 id="status">Show Shadow Clone Hand Sign</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(results => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw video
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  let fingerCount = 0;

  if (results.multiHandLandmarks) {
    results.multiHandLandmarks.forEach((landmarks) => {

      // ✅ DRAW HAND STRUCTURE
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
        color: "#00FF00",
        lineWidth: 3
      });

      drawLandmarks(ctx, landmarks, {
        color: "#FF0000",
        lineWidth: 2
      });

      // ✅ SIMPLE 2 FINGER DETECTION
      const indexUp = landmarks[8].y < landmarks[6].y;
      const middleUp = landmarks[12].y < landmarks[10].y;

      if (indexUp && middleUp) {
        fingerCount++;
      }
    });
  }

  // ✅ TRIGGER LOGIC
  if (fingerCount === 2) {
    statusText.innerText = "⚡ CLONE JUTSU ACTIVATED!";
    flashEffect();
  } else {
    statusText.innerText = "Show 2 fingers on both hands";
  }

  ctx.restore();
});

// Camera setup
const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});
camera.start();

// Simple flash effect
function flashEffect() {
  document.body.style.background = "blue";

  setTimeout(() => {
    document.body.style.background = "black";
  }, 200);
}
</script>

</body>
</html>
