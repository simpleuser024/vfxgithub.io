<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Eternal Grimoire | Firebase Cloud Spellbook 📖</title>
  <!-- Three.js + GSAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0510;
      z-index: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid #ff66cc;
      border-top: 3px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Enter Overlay */
    .enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0510;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    .cover-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .cover-content {
      position: relative;
      text-align: center;
      z-index: 10;
      animation: coverFloat 2s infinite alternate;
    }

    @keyframes coverFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 20px #ff44cc);}
      100% { transform: translateY(-15px); filter: drop-shadow(0 0 50px #00ffff);}
    }

    .cover-content h1 {
      font-size: 3.5rem;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 8px;
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .enter-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }

    /* Main Grimoire UI */
    .grimoire-ui {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .grimoire-ui.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Header */
    .book-header {
      text-align: center;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
      z-index: 20;
    }

    .book-title {
      font-size: 1.3rem;
      letter-spacing: 2px;
    }

    .book-title span {
      display: inline-block;
      animation: emojiPop 1s infinite alternate;
    }

    @keyframes emojiPop {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor);}
      100% { transform: scale(1.2); filter: drop-shadow(0 0 15px currentColor);}
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 0.5rem;
      z-index: 20;
      font-size: 0.8rem;
    }

    .stats-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffddee;
    }

    /* Sync Status */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.6);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff00;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Page Container */
    .page-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .current-page {
      width: 90%;
      max-width: 1200px;
      height: 65vh;
      background: rgba(20, 10, 35, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 1.2rem;
      border: 2px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 40px rgba(0,255,255,0.2);
      animation: pageEnter 0.5s ease;
      overflow-y: auto;
      position: relative;
    }

    .current-page::-webkit-scrollbar {
      width: 6px;
    }
    .current-page::-webkit-scrollbar-track {
      background: #1a0f2e;
      border-radius: 10px;
    }
    .current-page::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: scale(0.95) rotateY(-10deg); }
      to { opacity: 1; transform: scale(1) rotateY(0); }
    }

    .page-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 30px;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 2;
    }

    .page-header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,102,204,0.5);
    }

    /* 4x3 Grid */
    .spells-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    .spell-card {
      background: linear-gradient(145deg, rgba(26, 15, 46, 0.9), rgba(10, 5, 24, 0.9));
      border-radius: 16px;
      padding: 0.7rem;
      border-left: 3px solid #ff66cc;
      transition: all 0.3s;
      cursor: pointer;
    }

    .spell-card:hover {
      transform: translateY(-5px);
      border-left-color: cyan;
      box-shadow: 0 0 20px cyan;
    }

    .spell-emoji {
      font-size: 1.8rem;
      text-align: center;
      filter: drop-shadow(0 0 8px magenta);
      animation: emojiGlow 2s infinite alternate;
    }

    @keyframes emojiGlow {
      0% { filter: drop-shadow(0 0 2px #ff44cc);}
      100% { filter: drop-shadow(0 0 15px #00ffff);}
    }

    .spell-name {
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
      margin: 0.4rem 0 0.2rem;
      word-break: break-word;
      color: #ffddff;
    }

    .spell-type {
      font-size: 0.55rem;
      text-align: center;
      color: #aaccff;
    }

    .spell-actions {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .spell-btn {
      flex: 1;
      padding: 0.25rem;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.6rem;
      transition: 0.2s;
    }

    .cast-btn { background: #00aacc; color: white; }
    .cast-btn:hover { background: cyan; color: black; }
    .rename-btn { background: #7a3a9a; color: white; }
    .delete-btn { background: #cc3366; color: white; }

    /* Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 45px;
      height: 45px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 30;
      transition: 0.3s;
      border: 1px solid #ff66cc;
    }

    .nav-arrow:hover {
      background: rgba(0, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-prev { left: 15px; }
    .nav-next { right: 15px; }

    /* Add Spell Section */
    .ritual-altar {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      padding: 0.6rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      border-top: 1px solid rgba(0, 255, 255, 0.4);
      z-index: 20;
    }

    .ancient-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.4rem 0.8rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      flex: 1;
      min-width: 120px;
      font-size: 0.8rem;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.8rem;
    }

    .magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px cyan;
    }

    @media (max-width: 900px) {
      .spells-grid { grid-template-columns: repeat(3, 1fr); }
      .current-page { width: 92%; height: 60vh; }
      .cover-content h1 { font-size: 2rem; }
    }
    @media (max-width: 600px) {
      .spells-grid { grid-template-columns: repeat(2, 1fr); }
      .book-title { font-size: 0.9rem; }
      .stats-bar { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <p style="color:#ff66cc;">🔮 Connecting to Cloud Grimoire... 🔮</p>
</div>

<!-- Enter Overlay -->
<div class="enter-overlay" id="enterOverlay" style="display:none;">
  <img class="cover-bg" id="coverBgImg" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070" alt="Cover">
  <div class="cover-content">
    <h1>📖 CLOUD GRIMOIRE 📖</h1>
    <button class="enter-btn" id="enterBtn">🔮 OPEN THE GRIMOIRE 🔮</button>
  </div>
</div>

<!-- Main UI -->
<div class="grimoire-ui" id="grimoireUI">
  <div class="book-header">
    <div class="book-title">
      <span>⚜️</span> CLOUD CODEX <span>📖</span> <span>✨</span> <span>🔮</span> <span>☁️</span>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stats-item"><span>📜</span> SPELLS: <strong id="totalSpells">0</strong></div>
    <div class="stats-item"><span>📖</span> PAGE: <strong id="currentPageNum">1</strong> / <strong id="totalPages">1</strong></div>
    <div class="stats-item"><span>💾</span> FILES: <strong id="fileCount">0</strong></div>
    <div class="sync-status"><span class="sync-dot"></span> <span id="syncText">Synced</span></div>
    <button id="clearAllBtn" class="magic-btn" style="background:#a03366;">💀 PURGE</button>
  </div>

  <div class="page-container">
    <div class="nav-arrow nav-prev" id="prevPage">◀</div>
    <div class="current-page" id="currentPage">
      <img class="page-bg-img" id="pageBgImg" src="https://images.unsplash.com/photo-1538370965046-79c0d6907d47?q=80&w=2069" alt="Page BG">
      <div class="page-content" id="pageContent"></div>
    </div>
    <div class="nav-arrow nav-next" id="nextPage">▶</div>
  </div>

  <div class="ritual-altar">
    <input type="file" id="fileInput" multiple style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.3rem 0.6rem; color:white; font-size:0.7rem;">
    <button id="uploadBtn" class="magic-btn">✨ ENCHANT FILE ✨</button>
    <input type="text" id="spellName" class="ancient-input" placeholder="Spell Name">
    <input type="text" id="spellUrl" class="ancient-input" placeholder="URL or Path">
    <button id="addUrlBtn" class="magic-btn">🔗 FORGE LINK</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';
  
  // ==================== FIREBASE IMPORTS ====================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getDatabase, ref, set, get, child, remove, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBzGBwKCo9_dIo2_EnzBfymrBP0PwC-j9A",
    authDomain: "grimvoir-b11b4.firebaseapp.com",
    databaseURL: "https://grimvoir-b11b4-default-rtdb.firebaseio.com",
    projectId: "grimvoir-b11b4",
    storageBucket: "grimvoir-b11b4.firebasestorage.app",
    messagingSenderId: "545817815225",
    appId: "1:545817815225:web:e4dd9d9d72e3e3ec6a9368",
    measurementId: "G-QPRMEL4EXZ"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const database = getDatabase(app);
  const spellsRef = ref(database, 'grimoire/spells');

  // ==================== 3D BACKGROUND (SAME AS BEFORE) ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.0015);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0xff44cc, 0.5);
  backLight.position.set(-3, 2, -6);
  scene.add(backLight);
  const magicLight = new THREE.PointLight(0x44aaff, 0.7);
  magicLight.position.set(4, 3, 4);
  scene.add(magicLight);

  const orbGroup = new THREE.Group();
  const orbs = [];
  for (let i = 0; i < 80; i++) {
    const geo = new THREE.SphereGeometry(0.08, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: [0xff66cc, 0x00ffff, 0xffaa44][i%3], emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = { radius: 1.5 + Math.random() * 3.5, speed: 0.002 + Math.random() * 0.015, angle: Math.random() * Math.PI * 2, yBase: (Math.random() - 0.5) * 4 };
    orbGroup.add(orb);
    orbs.push(orb);
  }
  scene.add(orbGroup);

  const crystalGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133, roughness: 0.2, metalness: 0.8 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.castShadow = true;
  crystal.position.set(0, 1, 0);
  scene.add(crystal);

  const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);
  const ring2Geo = new THREE.TorusGeometry(1.5, 0.04, 64, 200);
  const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.z = Math.PI / 3;
  scene.add(ring2);

  const particleCount = 1500;
  const particleGeo = new THREE.BufferGeometry();
  const particlePos = [];
  for (let i = 0; i < particleCount; i++) {
    particlePos.push((Math.random() - 0.5) * 250, (Math.random() - 0.5) * 120, (Math.random() - 0.5) * 100 - 50);
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlePos), 3));
  const particleMat = new THREE.PointsMaterial({ color: 0xffaaff, size: 0.06 });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    crystal.rotation.y = time3d * 0.4;
    ring.rotation.z += 0.007;
    ring2.rotation.x += 0.005;
    ring2.rotation.y += 0.006;
    orbs.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.6 + d.yBase;
    });
    particles.rotation.y += 0.0003;
    magicLight.intensity = 0.5 + Math.sin(time3d) * 0.3;
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    renderer.render(scene, camera);
  }
  animate3d();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== FIREBASE STORAGE LOGIC ====================
  let spells = [];
  let currentPage = 0;
  let totalPages = 1;
  let isSyncing = false;

  function updateSyncStatus(status, isError = false) {
    const syncText = document.getElementById('syncText');
    const syncDot = document.querySelector('.sync-dot');
    if (syncText) {
      syncText.textContent = status;
      if (isError) {
        syncDot.style.background = '#ff3366';
      } else {
        syncDot.style.background = '#00ff00';
      }
    }
  }

  // Save all spells to Firebase
  async function saveToFirebase(spellsData) {
    try {
      updateSyncStatus('Saving...');
      await set(spellsRef, spellsData);
      updateSyncStatus('Synced');
      return true;
    } catch (error) {
      console.error('Firebase save error:', error);
      updateSyncStatus('Error!', true);
      return false;
    }
  }

  // Load spells from Firebase
  async function loadFromFirebase() {
    try {
      updateSyncStatus('Loading...');
      const snapshot = await get(spellsRef);
      if (snapshot.exists()) {
        spells = snapshot.val();
        if (!Array.isArray(spells)) spells = [];
        updateSyncStatus('Synced');
        return true;
      } else {
        spells = [];
        updateSyncStatus('Ready');
        return true;
      }
    } catch (error) {
      console.error('Firebase load error:', error);
      updateSyncStatus('Offline Mode', true);
      spells = [];
      return false;
    }
  }

  // Real-time listener for cloud changes
  function listenToCloudChanges() {
    onValue(spellsRef, (snapshot) => {
      if (!isSyncing && snapshot.exists()) {
        const cloudSpells = snapshot.val();
        if (Array.isArray(cloudSpells) && JSON.stringify(cloudSpells) !== JSON.stringify(spells)) {
          spells = cloudSpells;
          renderCurrentPage();
          updateFileCount();
          console.log('📡 Cloud sync: spells updated');
        }
      }
    });
  }

  // Helper functions
  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }

  function getRandomEmoji() {
    const emojis = ['🔮', '✨', '⚡', '🔥', '💧', '🌪️', '❄️', '🌈', '⭐', '🌙', '💀', '👁️', '🐉', '🗡️', '🛡️', '📜', '🎴', '🌀', '💫', '🌟'];
    return emojis[Math.floor(Math.random() * emojis.length)];
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  async function updateFileCount() {
    const fileCount = spells.filter(s => s.isFile).length;
    document.getElementById('fileCount').textContent = fileCount;
  }

  // Render current page
  async function renderCurrentPage() {
    const spellsPerPage = 12;
    totalPages = Math.max(1, Math.ceil(spells.length / spellsPerPage));
    if (currentPage >= totalPages) currentPage = totalPages - 1;
    if (currentPage < 0) currentPage = 0;
    
    document.getElementById('totalSpells').textContent = spells.length;
    document.getElementById('totalPages').textContent = totalPages;
    document.getElementById('currentPageNum').textContent = currentPage + 1;
    
    const start = currentPage * spellsPerPage;
    const pageSpells = spells.slice(start, start + spellsPerPage);
    
    let html = `
      <div class="page-header-info">
        <span class="page-number">📖 Page ${currentPage + 1} of ${totalPages}</span>
        <span class="page-decoration">${getRandomEmoji()} ${getRandomEmoji()} ${getRandomEmoji()}</span>
      </div>
      <div class="spells-grid">
    `;
    
    for (const spell of pageSpells) {
      html += `
        <div class="spell-card" data-id="${spell.id}">
          <div class="spell-emoji">${getRandomEmoji()}</div>
          <div class="spell-name">${escapeHtml(spell.name.length > 25 ? spell.name.substring(0, 22) + '...' : spell.name)}</div>
          <div class="spell-type">${spell.isFile ? `📀 ${spell.sizeDisplay}` : '🔗 Link Spell'}</div>
          <div class="spell-actions">
            <button class="spell-btn cast-btn" data-action="cast" data-id="${spell.id}">⚡ CAST</button>
            <button class="spell-btn rename-btn" data-action="rename" data-id="${spell.id}">✏️ RENAME</button>
            <button class="spell-btn delete-btn" data-action="delete" data-id="${spell.id}">🗑️ DEL</button>
          </div>
        </div>
      `;
    }
    
    const remaining = spellsPerPage - pageSpells.length;
    for (let i = 0; i < remaining; i++) {
      html += `<div class="spell-card" style="opacity:0.5;"><div class="spell-emoji">📖</div><div class="spell-name">Empty Slot</div><div class="spell-type">Awaiting Spell...</div><div class="spell-actions"><button class="spell-btn" disabled style="background:#444;">—</button></div></div>`;
    }
    
    html += `</div>`;
    document.getElementById('pageContent').innerHTML = html;
    
    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const spell = spells.find(s => s.id === id);
        if (spell) {
          gsap.to(btn.closest('.spell-card'), { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
          if (spell.isFile && spell.fileBase64) {
            const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } else if (spell.urlPath) {
            window.open(spell.urlPath, '_blank');
          }
        }
      });
    });
    
    document.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const newName = prompt('✏️ Rename your spell:', spells.find(s => s.id === id)?.name);
        if (newName && newName.trim()) {
          const spell = spells.find(s => s.id === id);
          if (spell) {
            spell.name = newName.trim();
            isSyncing = true;
            await saveToFirebase(spells);
            isSyncing = false;
            await renderCurrentPage();
          }
        }
      });
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Dispel this spell from the grimoire?')) {
          const id = btn.getAttribute('data-id');
          spells = spells.filter(s => s.id !== id);
          isSyncing = true;
          await saveToFirebase(spells);
          isSyncing = false;
          await renderCurrentPage();
          await updateFileCount();
        }
      });
    });
  }

  // Add spells
  async function addFileSpell(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      spells.push({
        id: generateId(),
        name: file.name,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      });
    }
    isSyncing = true;
    await saveToFirebase(spells);
    isSyncing = false;
    await renderCurrentPage();
    await updateFileCount();
  }

  async function addUrlSpell(name, url) {
    if (!name.trim()) name = 'Mystic Link';
    if (!url.trim()) url = '#';
    spells.push({
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: 'Link Spell'
    });
    isSyncing = true;
    await saveToFirebase(spells);
    isSyncing = false;
    await renderCurrentPage();
  }

  async function clearAllSpells() {
    spells = [];
    isSyncing = true;
    await saveToFirebase(spells);
    isSyncing = false;
    await renderCurrentPage();
    await updateFileCount();
  }

  // Navigation
  function nextPage() { if (currentPage + 1 < totalPages) { currentPage++; renderCurrentPage(); gsap.fromTo('.current-page', { scale: 0.95, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.4 }); } }
  function prevPage() { if (currentPage > 0) { currentPage--; renderCurrentPage(); gsap.fromTo('.current-page', { scale: 0.95, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.4 }); } }

  // Initialize App
  async function init() {
    await loadFromFirebase();
    listenToCloudChanges();
    await renderCurrentPage();
    await updateFileCount();
    
    // Hide loading, show enter overlay
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('enterOverlay').style.display = 'flex';
    console.log('📖 Cloud Grimoire Connected! All spells saved to Firebase.');
  }

  // Enter animation
  document.addEventListener('DOMContentLoaded', () => {
    init();
    
    document.getElementById('prevPage').addEventListener('click', prevPage);
    document.getElementById('nextPage').addEventListener('click', nextPage);
    
    const enterOverlay = document.getElementById('enterOverlay');
    const grimoireUI = document.getElementById('grimoireUI');
    const enterBtn = document.getElementById('enterBtn');
    
    enterBtn.addEventListener('click', () => {
      gsap.to(enterOverlay, {
        duration: 0.8,
        rotationY: -90,
        transformOrigin: "left center",
        ease: "power2.inOut",
        onComplete: () => {
          enterOverlay.style.display = 'none';
          grimoireUI.classList.add('open');
          gsap.fromTo('.current-page', { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6 });
        }
      });
    });
    
    // UI Events
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) { alert('Select files to enchant!'); return; }
      await addFileSpell(Array.from(fileInput.files));
      fileInput.value = '';
    });
    
    document.getElementById('addUrlBtn').addEventListener('click', async () => {
      const name = document.getElementById('spellName').value;
      const url = document.getElementById('spellUrl').value;
      if (!name && !url) { alert('Name and path required!'); return; }
      await addUrlSpell(name, url);
      document.getElementById('spellName').value = '';
      document.getElementById('spellUrl').value = '';
    });
    
    document.getElementById('clearAllBtn').addEventListener('click', async () => {
      if (confirm('⚠️ This will banish ALL spells from the cloud! Continue?')) {
        await clearAllSpells();
      }
    });
    
    // Drag and drop
    const altar = document.querySelector('.ritual-altar');
    altar.addEventListener('dragover', (e) => { e.preventDefault(); altar.style.border = '2px solid cyan'; });
    altar.addEventListener('dragleave', () => { altar.style.border = ''; });
    altar.addEventListener('drop', async (e) => {
      e.preventDefault();
      altar.style.border = '';
      const dropped = Array.from(e.dataTransfer.files);
      if (dropped.length) await addFileSpell(dropped);
    });
  });
</script>
</body>
</html>
