<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Eternal Grimoire | 3D Spellbook with Page Flip 📖</title>
  <!-- Three.js + GSAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Cinema', 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
      color: #f0e6ff;
    }

    /* Canvas 3D Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image: url(image.png);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Enter Page - Fullscreen Cover with Flip Animation */
    .enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a0a2e, #020008);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    .cover-content {
      text-align: center;
      animation: coverBreathing 2s infinite alternate;
    }

    @keyframes coverBreathing {
      0% { text-shadow: 0 0 20px #ff44cc, 0 0 40px #00ffff; transform: scale(1);}
      100% { text-shadow: 0 0 60px #ff66ff, 0 0 90px #00ffff; transform: scale(1.05);}
    }

    .cover-content h1 {
      font-size: 4.5rem;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 10px;
    }

    .cover-content p {
      margin-top: 1rem;
      color: #ccaaee;
      font-size: 1.2rem;
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .enter-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
      border-color: cyan;
    }

    /* Main Grimoire UI - Book Style */
    .grimoire-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, rgba(10, 5, 25, 0.5), rgba(0, 0, 0, 0.7));
      backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .grimoire-container.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Book Header */
    .book-header {
      text-align: center;
      padding: 1rem;
      background: rgba(20, 10, 40, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
    }

    .book-title {
      font-size: 2rem;
      background: linear-gradient(135deg, #ffcc66, #ff66cc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    /* Book Pages Container - Flip Book Style */
    .book-pages-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 2rem;
      position: relative;
    }

    /* Custom Scrollbar */
    .book-pages-wrapper::-webkit-scrollbar {
      width: 8px;
    }
    .book-pages-wrapper::-webkit-scrollbar-track {
      background: #1a0f2e;
      border-radius: 10px;
    }
    .book-pages-wrapper::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    /* Pages Grid - Each Page has 12 Spells */
    .page {
      background: rgba(25, 15, 50, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      margin-bottom: 2rem;
      padding: 1.5rem;
      border: 1px solid rgba(0, 255, 255, 0.3);
      animation: pageFlipIn 0.8s ease-out;
      transform-origin: left center;
    }

    @keyframes pageFlipIn {
      0% {
        transform: rotateY(-90deg);
        opacity: 0;
      }
      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }

    .page-number {
      font-size: 0.9rem;
      color: #ffaaee;
      border-bottom: 1px solid #ff66cc;
      display: inline-block;
      padding-bottom: 0.3rem;
      margin-bottom: 1rem;
    }

    .spells-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    /* Spell Card - Ancient Style */
    .spell-card {
      background: linear-gradient(145deg, #1a0f2e, #0a0518);
      border-radius: 20px;
      padding: 1rem;
      border-left: 4px solid #ff66cc;
      border-right: 1px solid #00ffff;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      animation: spellGlow 3s infinite alternate;
      position: relative;
      overflow: hidden;
    }

    @keyframes spellGlow {
      0% { border-left-color: #ff66cc; box-shadow: 0 0 5px rgba(255,102,204,0.3);}
      100% { border-left-color: #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.4);}
    }

    .spell-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-left-color: cyan;
      box-shadow: 0 0 30px cyan;
    }

    .spell-icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 8px magenta);
      animation: iconFloat 2s infinite alternate;
    }

    @keyframes iconFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 5px #ff44cc);}
      100% { transform: translateY(-5px); filter: drop-shadow(0 0 20px #00ffff);}
    }

    .spell-name {
      font-size: 1rem;
      font-weight: bold;
      margin: 0.5rem 0;
      word-break: break-word;
      color: #ffddff;
    }

    .spell-rune {
      font-size: 0.65rem;
      color: #aaccff;
      font-family: monospace;
    }

    .spell-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .spell-btn {
      flex: 1;
      padding: 0.4rem;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
    }

    .cast-btn { background: #00aacc; color: white; }
    .cast-btn:hover { background: cyan; color: black; box-shadow: 0 0 15px cyan; transform: scale(1.02);}
    .delete-btn { background: #cc3366; color: white; }

    /* Add Spell Section - Ritual Altar */
    .ritual-altar {
      background: rgba(20, 10, 40, 0.8);
      backdrop-filter: blur(16px);
      padding: 1rem 1.5rem;
      margin: 0 1rem 1rem 1rem;
      border-radius: 60px;
      border: 1px solid;
      border-image: linear-gradient(135deg, #ff66cc, #00ffff) 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }

    .ancient-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.6rem 1rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      flex: 1;
      min-width: 160px;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px cyan;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
      background: rgba(0, 0, 0, 0.5);
      margin: 0.5rem 1rem;
      border-radius: 50px;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (max-width: 750px) {
      .cover-content h1 { font-size: 2rem; }
      .spells-grid { grid-template-columns: 1fr; }
      .ancient-input { min-width: 120px; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Enter Overlay with Flip Animation -->
<div class="enter-overlay" id="enterOverlay">
  <div class="cover-content">
    <h1>📖 GRIMOIRE OF ETERNAL SPELLS 📖</h1>
    <p>✦ Open the ancient tome and awaken the magic ✦</p>
    <button class="enter-btn" id="enterBtn">🔮 ENTER THE GRIMOIRE 🔮</button>
  </div>
</div>

<!-- Main Grimoire UI -->
<div class="grimoire-container" id="grimoireContainer">
  <div class="book-header">
    <div class="book-title">⚜️ CODEX MAGICUS | THE SPELLBOOK ⚜️</div>
    <div style="font-size: 0.8rem;">✦ Each page holds 12 spells | Pages grow automatically ✦</div>
  </div>

  <div class="stats-bar">
    <span>📜 TOTAL SPELLS: <strong id="totalSpells">0</strong></span>
    <span>📖 PAGES: <strong id="totalPages">0</strong></span>
    <button id="clearAllBtn" class="magic-btn" style="background:#a03366; padding:0.3rem 1rem;">💀 PURGE ALL</button>
    <button id="exportBtn" class="magic-btn" style="background:#2a5e3a; padding:0.3rem 1rem;">💾 EXPORT</button>
    <button id="importBtn" class="magic-btn" style="background:#5e3a2a; padding:0.3rem 1rem;">📥 IMPORT</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
  </div>

  <!-- Book Pages Wrapper -->
  <div class="book-pages-wrapper" id="bookPagesWrapper">
    <div id="pagesContainer"></div>
  </div>

  <!-- Ritual Altar - Add Spells -->
  <div class="ritual-altar">
    <input type="file" id="fileInput" multiple style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.4rem 1rem; color:white;">
    <button id="uploadBtn" class="magic-btn">✨ ENCHANT FILE ✨</button>
    <input type="text" id="spellName" class="ancient-input" placeholder="Spell Name">
    <input type="text" id="spellUrl" class="ancient-input" placeholder="URL or Path">
    <button id="addUrlBtn" class="magic-btn">🔗 FORGE LINK</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';

  // ==================== 3D MAGICAL BACKGROUND ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.002);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0xff44cc, 0.5);
  backLight.position.set(-3, 2, -6);
  scene.add(backLight);
  const magicLight = new THREE.PointLight(0x44aaff, 0.7);
  magicLight.position.set(4, 3, 4);
  scene.add(magicLight);

  // Floating Orbs (Magic Spells)
  const orbGroup = new THREE.Group();
  const orbs = [];
  for (let i = 0; i < 50; i++) {
    const geo = new THREE.SphereGeometry(0.1, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: 0xff66aa, emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = {
      radius: 1.8 + Math.random() * 2.5,
      speed: 0.003 + Math.random() * 0.01,
      angle: Math.random() * Math.PI * 2,
      yBase: (Math.random() - 0.5) * 3
    };
    orbGroup.add(orb);
    orbs.push(orb);
  }
  scene.add(orbGroup);

  // Central Crystal
  const crystalGeo = new THREE.IcosahedronGeometry(0.8, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133, roughness: 0.2, metalness: 0.8 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.castShadow = true;
  crystal.position.set(0, 1.2, 0);
  scene.add(crystal);

  // Rings
  const ringGeo = new THREE.TorusGeometry(1.2, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const ring2Geo = new THREE.TorusGeometry(1.6, 0.04, 64, 200);
  const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.z = Math.PI / 3;
  scene.add(ring2);

  // Starfield
  const starCount = 2000;
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < starCount; i++) {
    starPos.push((Math.random() - 0.5) * 300);
    starPos.push((Math.random() - 0.5) * 150);
    starPos.push((Math.random() - 0.5) * 120 - 60);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
  const starMat = new THREE.PointsMaterial({ color: 0xaaffff, size: 0.06 });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    
    crystal.rotation.y = time3d * 0.3;
    crystal.rotation.x = Math.sin(time3d * 0.5) * 0.2;
    ring.rotation.z += 0.006;
    ring2.rotation.x += 0.004;
    ring2.rotation.y += 0.005;
    
    orbs.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.8) * 0.8 + d.yBase;
    });
    
    stars.rotation.y += 0.0003;
    stars.rotation.x += 0.0002;
    magicLight.intensity = 0.6 + Math.sin(time3d) * 0.2;
    
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    
    renderer.render(scene, camera);
  }
  animate3d();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== INDEXEDDB STORAGE (PERMANENT) ====================
  const DB_NAME = 'Eternal_Grimoire_DB';
  const DB_VERSION = 5;
  const STORE_NAME = 'spells';
  let db = null;
  let spells = [];

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function saveSpell(spellData) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(spellData);
      request.onsuccess = () => resolve(spellData);
      request.onerror = () => reject(request.error);
    });
  }

  async function getAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteSpell(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function clearAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function getSpellIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const icons = { html: '🌐🔥', css: '🎨✨', js: '⚡🔮', png: '🖼️📜', jpg: '🖼️📜', mp4: '🎥🌀', pdf: '📕🔮', txt: '📄✨' };
    return icons[ext] || '🔮📖';
  }

  // Render Pages - Each Page has 12 Spells
  async function renderBook() {
    spells = await getAllSpells();
    const totalSpellsSpan = document.getElementById('totalSpells');
    const totalPagesSpan = document.getElementById('totalPages');
    totalSpellsSpan.textContent = spells.length;
    
    // Calculate pages (12 spells per page)
    const spellsPerPage = 12;
    const pageCount = Math.ceil(spells.length / spellsPerPage);
    totalPagesSpan.textContent = pageCount || 1;
    
    const pagesContainer = document.getElementById('pagesContainer');
    if (spells.length === 0) {
      pagesContainer.innerHTML = `<div class="page" style="text-align:center; padding:3rem;">
        <div class="page-number">Page I</div>
        <div class="empty-pages">🌀 The pages are blank... Add a spell to begin 🌀<br>Upload files or forge links!</div>
      </div>`;
      return;
    }
    
    let html = '';
    for (let pageIdx = 0; pageIdx < pageCount; pageIdx++) {
      const start = pageIdx * spellsPerPage;
      const pageSpells = spells.slice(start, start + spellsPerPage);
      const pageNumRoman = pageIdx + 1;
      
      html += `<div class="page" data-page="${pageIdx}">
        <div class="page-number">📖 Page ${pageNumRoman} • ${pageSpells.length} Spells Bound</div>
        <div class="spells-grid" id="page-${pageIdx}">
      `;
      
      for (const spell of pageSpells) {
        html += `
          <div class="spell-card" data-id="${spell.id}">
            <div class="spell-icon">${getSpellIcon(spell.name)}</div>
            <div class="spell-name">${escapeHtml(spell.name)}</div>
            <div class="spell-rune">${spell.isFile ? `📀 ${spell.sizeDisplay} • File Enchantment` : '🔗 Dimensional Link'}</div>
            <div class="spell-actions">
              <button class="spell-btn cast-btn" data-action="cast" data-id="${spell.id}">⚡ CAST</button>
              <button class="spell-btn delete-btn" data-action="delete" data-id="${spell.id}">🗑️ DELETE</button>
            </div>
          </div>
        `;
      }
      html += `</div></div>`;
    }
    
    pagesContainer.innerHTML = html;
    
    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const spell = spells.find(s => s.id === id);
        if (spell) {
          const card = btn.closest('.spell-card');
          gsap.to(card, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
          
          if (spell.isFile && spell.fileBase64) {
            const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } else if (spell.urlPath) {
            window.open(spell.urlPath, '_blank');
          } else alert('No spell content to cast!');
        }
      });
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Dispel this spell from the grimoire?')) {
          const id = btn.getAttribute('data-id');
          await deleteSpell(id);
          await renderBook();
        }
      });
    });
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Add File Spell with Animation
  async function addFileSpell(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      const spell = {
        id: generateId(),
        name: file.name,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      };
      await saveSpell(spell);
    }
    await renderBook();
    // Scroll to new page
    const wrapper = document.getElementById('bookPagesWrapper');
    wrapper.scrollTop = wrapper.scrollHeight;
  }

  // Add URL Spell
  async function addUrlSpell(name, url) {
    if (!name.trim()) name = 'Mystic Link';
    if (!url.trim()) url = '#';
    const spell = {
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: 'Link Spell'
    };
    await saveSpell(spell);
    await renderBook();
    const wrapper = document.getElementById('bookPagesWrapper');
    wrapper.scrollTop = wrapper.scrollHeight;
  }

  // Export/Import
  async function exportGrimoire() {
    const allSpells = await getAllSpells();
    const exportData = { version: 5, exportDate: new Date().toISOString(), spells: allSpells };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grimoire_backup_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('📖 Grimoire exported! Save this sacred tome.');
  }

  async function importGrimoire(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const importedSpells = data.spells || [];
        for (const spell of importedSpells) {
          const newSpell = { ...spell, id: generateId() };
          await saveSpell(newSpell);
        }
        await renderBook();
        alert(`✨ Imported ${importedSpells.length} spells into your grimoire!`);
      } catch(err) { alert('Invalid grimoire file'); }
    };
    reader.readAsText(file);
  }

  // Enter Animation - Page Flip Effect
  const enterOverlay = document.getElementById('enterOverlay');
  const grimoireContainer = document.getElementById('grimoireContainer');
  const enterBtn = document.getElementById('enterBtn');
  
  enterBtn.addEventListener('click', () => {
    // Page flip animation
    gsap.to(enterOverlay, {
      duration: 0.8,
      rotationY: -90,
      transformOrigin: "left center",
      ease: "power2.inOut",
      onComplete: () => {
        enterOverlay.style.display = 'none';
        grimoireContainer.classList.add('open');
        // Animate pages entrance
        gsap.fromTo('.page', 
          { rotationY: -90, opacity: 0 },
          { rotationY: 0, opacity: 1, duration: 0.6, stagger: 0.1, ease: "back.out(1.2)" }
        );
      }
    });
  });

  // Initialize
  async function init() {
    await openDB();
    await renderBook();
    console.log('📖 Eternal Grimoire Awakened! Spells persist forever.');
  }

  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();
    
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const addUrlBtn = document.getElementById('addUrlBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const spellName = document.getElementById('spellName');
    const spellUrl = document.getElementById('spellUrl');
    
    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) { alert('Select files to enchant!'); return; }
      await addFileSpell(Array.from(fileInput.files));
      fileInput.value = '';
    });
    
    addUrlBtn.addEventListener('click', async () => {
      const name = spellName.value;
      const url = spellUrl.value;
      if (!name && !url) { alert('Name your spell and provide a path!'); return; }
      await addUrlSpell(name, url);
      spellName.value = '';
      spellUrl.value = '';
    });
    
    clearAllBtn.addEventListener('click', async () => {
      if (confirm('⚠️ THIS WILL BANISH ALL SPELLS FROM THE GRIMOIRE! Continue?')) {
        await clearAllSpells();
        await renderBook();
      }
    });
    
    exportBtn.addEventListener('click', exportGrimoire);
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await importGrimoire(e.target.files[0]);
        importFile.value = '';
      }
    });
    
    // Drag and Drop
    const altar = document.querySelector('.ritual-altar');
    altar.addEventListener('dragover', (e) => { e.preventDefault(); altar.style.border = '3px solid cyan'; });
    altar.addEventListener('dragleave', () => { altar.style.border = ''; });
    altar.addEventListener('drop', async (e) => {
      e.preventDefault();
      altar.style.border = '';
      const dropped = Array.from(e.dataTransfer.files);
      if (dropped.length) await addFileSpell(dropped);
    });
  });
</script>
</body>
</html>
