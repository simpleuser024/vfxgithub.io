<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✨ Grimoire of Eternal Spells | 3D Anime Spellbook ✨</title>
  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', 'Cinema', 'Orbitron', monospace;
      overflow: hidden;
      background: #050510;
      color: #f0eaff;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* UI Overlay - Grimoire Book Style */
    .grimoire-ui {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      padding: 1.5rem;
      background: radial-gradient(circle at 20% 30%, rgba(5, 5, 30, 0.4), rgba(0, 0, 0, 0.7));
      backdrop-filter: blur(5px);
      scroll-behavior: smooth;
    }

    /* Custom Scrollbar */
    .grimoire-ui::-webkit-scrollbar {
      width: 8px;
    }
    .grimoire-ui::-webkit-scrollbar-track {
      background: #1a0f2e;
      border-radius: 10px;
    }
    .grimoire-ui::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Spellbook Header */
    .spellbook-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: floatGlow 3s infinite alternate;
      position: relative;
    }

    @keyframes floatGlow {
      0% { text-shadow: 0 0 5px #ff44cc, 0 0 10px #00ffff; transform: translateY(0px);}
      100% { text-shadow: 0 0 25px #ff66ff, 0 0 35px #00ffff; transform: translateY(-5px);}
    }

    .title {
      font-size: 3.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff99cc, #ff44aa, #00ffff, #ffcc44);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 5px;
    }

    .sub {
      color: #ccddff;
      background: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 0.3rem 1.5rem;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    /* Stats Bar */
    .stats-bar {
      background: rgba(20, 10, 40, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid rgba(0, 255, 255, 0.4);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    /* Add Spell Section - Ritual Circle Style */
    .ritual-circle {
      background: rgba(30, 15, 55, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 80px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      border: 2px solid;
      border-image: linear-gradient(135deg, #ff66cc, #00ffff) 1;
      animation: borderRotate 4s infinite alternate;
      box-shadow: 0 0 40px rgba(0,255,255,0.2);
    }

    @keyframes borderRotate {
      0% { border-color: #ff66cc; box-shadow: 0 0 20px rgba(255,102,204,0.3);}
      100% { border-color: #00ffff; box-shadow: 0 0 40px rgba(0,255,255,0.5);}
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .spell-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      flex: 1;
      min-width: 200px;
      transition: 0.2s;
    }

    .spell-input:focus {
      outline: none;
      border-color: cyan;
      box-shadow: 0 0 15px cyan;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .magic-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 25px cyan;
    }

    .magic-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,255,0.4), transparent);
      transition: left 0.5s;
    }

    .magic-btn:hover::before {
      left: 100%;
    }

    .file-zone {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(0,0,0,0.5);
      border-radius: 60px;
      padding: 0.3rem 1rem;
    }

    /* Spell Grid - Magical Cards */
    .spell-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem;
      margin-top: 1rem;
    }

    .spell-card {
      background: rgba(15, 8, 35, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 1.2rem;
      border: 1px solid rgba(255, 100, 200, 0.6);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: cardEnter 0.5s ease-out;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(30px) rotateX(-10deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
    }

    .spell-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: cyan;
      box-shadow: 0 0 35px rgba(0,255,255,0.4);
    }

    /* Spell Animation on Add */
    .spell-card.adding {
      animation: spellSummon 0.8s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes spellSummon {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
        filter: blur(10px);
      }
      50% {
        transform: scale(1.1) rotate(5deg);
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    .spell-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 10px magenta);
      animation: iconGlow 2s infinite alternate;
      display: inline-block;
    }

    @keyframes iconGlow {
      0% { filter: drop-shadow(0 0 5px #ff44cc);}
      100% { filter: drop-shadow(0 0 20px #00ffff);}
    }

    .spell-name {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0.5rem 0;
      word-break: break-word;
      background: linear-gradient(135deg, #fff, #ffccff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .spell-type {
      font-size: 0.7rem;
      color: #aaccff;
      font-family: monospace;
      margin-bottom: 0.5rem;
    }

    .spell-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .spell-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 40px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
    }

    .cast-btn {
      background: linear-gradient(135deg, #00aacc, #0077aa);
      color: white;
    }
    .cast-btn:hover { background: cyan; color: black; box-shadow: 0 0 15px cyan; transform: scale(1.02);}

    .rename-btn {
      background: #7a3a9a;
      color: white;
    }
    .delete-btn {
      background: #cc3366;
      color: white;
    }

    .empty-grimoire {
      text-align: center;
      padding: 4rem;
      background: rgba(0,0,0,0.5);
      border-radius: 60px;
    }

    /* Backup Section */
    .backup-section {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      padding: 1rem;
      background: rgba(0,0,0,0.4);
      border-radius: 60px;
    }

    @media (max-width: 700px) {
      .title { font-size: 1.8rem; }
      .ritual-circle { padding: 1rem; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="grimoire-ui">
  <div class="container">
    <div class="spellbook-header">
      <div class="title">📖 GRIMOIRE OF ETERNAL SPELLS 📖</div>
      <div class="sub">✦ 3D ANIME DIMENSION | CAST FILES AS MAGIC SPELLS ✦</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">🔮 SPELLS IN GRIMOIRE: <strong id="spellCount">0</strong></div>
      <div class="stat-item">⚡ MANA CRYSTALS: <strong id="manaCrystals">∞</strong></div>
      <button id="clearAllBtn" class="magic-btn" style="background:#cc3366; padding:0.4rem 1.2rem;">💀 PURGE ALL SPELLS</button>
    </div>

    <!-- Ritual Circle - Add Spell -->
    <div class="ritual-circle">
      <div class="form-row">
        <div class="file-zone">
          <span>📁</span>
          <input type="file" id="fileInput" multiple style="background:transparent; border:none; color:white;">
        </div>
        <button id="uploadBtn" class="magic-btn">✨ ENCHANT & ADD FILE ✨</button>
      </div>
      <div class="form-row" style="margin-top: 1rem;">
        <input type="text" id="spellName" class="spell-input" placeholder="Spell Name (e.g., Dragon Slayer)">
        <input type="text" id="spellUrl" class="spell-input" placeholder="URL or Path (e.g., ./spells/fireball.html)">
        <button id="addUrlBtn" class="magic-btn">🔗 FORGE LINK SPELL</button>
      </div>
    </div>

    <!-- Spell Grid -->
    <div id="spellGrid" class="spell-grid">
      <div class="empty-grimoire">🌀 Summoning your grimoire... 🌀</div>
    </div>

    <!-- Backup & Export -->
    <div class="backup-section">
      <button id="exportBtn" class="magic-btn" style="background:#2a5e3a;">💾 EXPORT GRIMOIRE (Backup)</button>
      <button id="importBtn" class="magic-btn" style="background:#5e3a2a;">📥 IMPORT GRIMOIRE</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
      <span style="font-size:0.7rem; color:#aaa;">✨ Spells persist forever in your browser | Backup to carry across devices ✨</span>
    </div>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';

  // ========== 3D ANIME MAGICAL BACKGROUND ==========
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020210);
  scene.fog = new THREE.FogExp2(0x020210, 0.002);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 14);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x332244);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0xff44cc, 0.6);
  backLight.position.set(-3, 2, -5);
  scene.add(backLight);
  const colorLight = new THREE.PointLight(0x44aaff, 0.7);
  colorLight.position.set(4, 3, 4);
  scene.add(colorLight);

  // Floating Magic Orbs
  const orbGroup = new THREE.Group();
  const orbCount = 30;
  const orbs = [];
  for (let i = 0; i < orbCount; i++) {
    const geo = new THREE.SphereGeometry(0.12, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: 0xff66aa, emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = {
      radius: 2.5 + Math.random() * 1.5,
      speed: 0.005 + Math.random() * 0.01,
      angle: Math.random() * Math.PI * 2,
      yOffset: (Math.random() - 0.5) * 2
    };
    orbGroup.add(orb);
    orbs.push(orb);
  }
  scene.add(orbGroup);

  // Central Magic Crystal
  const crystalGeo = new THREE.IcosahedronGeometry(0.8, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133, roughness: 0.2, metalness: 0.7 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.castShadow = true;
  crystal.position.set(0, 1, 0);
  scene.add(crystal);

  // Floating Rings
  const ringGeo = new THREE.TorusGeometry(1.2, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const ring2Geo = new THREE.TorusGeometry(1.6, 0.04, 64, 200);
  const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.z = Math.PI / 3;
  scene.add(ring2);

  // Star Particles
  const starCount = 1200;
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < starCount; i++) {
    starPos.push((Math.random() - 0.5) * 200);
    starPos.push((Math.random() - 0.5) * 100);
    starPos.push((Math.random() - 0.5) * 80 - 40);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
  const starMat = new THREE.PointsMaterial({ color: 0xaaffff, size: 0.08 });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    
    crystal.rotation.y = time3d * 0.4;
    crystal.rotation.x = Math.sin(time3d * 0.6) * 0.2;
    ring.rotation.z += 0.008;
    ring2.rotation.x += 0.005;
    ring2.rotation.y += 0.007;
    
    orbs.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.8 + d.yOffset;
    });
    
    stars.rotation.y += 0.0005;
    stars.rotation.x += 0.0003;
    
    camera.position.x += (Math.sin(time3d * 0.2) * 0.1 - camera.position.x) * 0.03;
    camera.lookAt(0, 1, 0);
    
    renderer.render(scene, camera);
  }
  animate3d();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ========== SPELLBOOK STORAGE (IndexedDB) ==========
  const DB_NAME = 'Anime_Grimoire_DB';
  const DB_VERSION = 3;
  const STORE_NAME = 'spells';
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function saveSpell(spellData) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(spellData);
      request.onsuccess = () => resolve(spellData);
      request.onerror = () => reject(request.error);
    });
  }

  async function getAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteSpell(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function clearAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function getSpellIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const icons = { html: '🌐', css: '🎨', js: '⚡', png: '🖼️', jpg: '🖼️', mp4: '🎥', pdf: '📕', txt: '📄' };
    return icons[ext] || '🔮';
  }

  // Spell Animation Effect
  async function castSpellAnimation(element) {
    if (!element) return;
    element.style.animation = 'none';
    element.offsetHeight;
    element.style.animation = 'spellSummon 0.6s cubic-bezier(0.34, 1.2, 0.64, 1)';
    setTimeout(() => { if(element) element.style.animation = ''; }, 600);
  }

  // Render Grid with Magic
  async function renderSpellGrid() {
    const spells = await getAllSpells();
    const grid = document.getElementById('spellGrid');
    const countSpan = document.getElementById('spellCount');
    countSpan.textContent = spells.length;

    if (spells.length === 0) {
      grid.innerHTML = `<div class="empty-grimoire">📖 No spells yet... Add a file or create a link spell! 📖<br><span style="font-size:0.8rem;">Upload any file and it becomes a permanent magic spell</span></div>`;
      return;
    }

    grid.innerHTML = spells.map(spell => `
      <div class="spell-card" data-id="${spell.id}">
        <div class="spell-icon">${getSpellIcon(spell.name)}</div>
        <div class="spell-name">${escapeHtml(spell.name)}</div>
        <div class="spell-type">${spell.isFile ? `📀 ${spell.sizeDisplay} • File Spell` : '🔗 Dimensional Link Spell'}</div>
        <div class="spell-actions">
          <button class="spell-btn cast-btn" data-action="cast" data-id="${spell.id}">⚡ CAST SPELL</button>
          <button class="spell-btn rename-btn" data-action="rename" data-id="${spell.id}">✏️ RENAME</button>
          <button class="spell-btn delete-btn" data-action="delete" data-id="${spell.id}">🗑️ DISPEL</button>
        </div>
      </div>
    `).join('');

    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const spell = (await getAllSpells()).find(s => s.id === id);
        if (spell) {
          const card = btn.closest('.spell-card');
          castSpellAnimation(card);
          setTimeout(() => {
            if (spell.isFile && spell.fileBase64) {
              const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
              const url = URL.createObjectURL(blob);
              window.open(url, '_blank');
              setTimeout(() => URL.revokeObjectURL(url), 60000);
            } else if (spell.urlPath) {
              window.open(spell.urlPath, '_blank');
            } else alert('No spell content to cast!');
          }, 200);
        }
      });
    });

    document.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const newName = prompt('✏️ Rename your spell:', '');
        if (newName && newName.trim()) {
          const spells = await getAllSpells();
          const spell = spells.find(s => s.id === id);
          if (spell) {
            spell.name = newName.trim();
            await saveSpell(spell);
            renderSpellGrid();
          }
        }
      });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Dispel this spell forever?')) {
          const id = btn.getAttribute('data-id');
          await deleteSpell(id);
          renderSpellGrid();
        }
      });
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Add File Spell with Animation
  async function addFileSpell(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      const spell = {
        id: generateId(),
        name: file.name,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      };
      await saveSpell(spell);
    }
    await renderSpellGrid();
    // Trigger animation on new cards
    const cards = document.querySelectorAll('.spell-card');
    if (cards.length) cards[cards.length - 1].style.animation = 'spellSummon 0.7s ease-out';
  }

  // Add URL Spell
  async function addUrlSpell(name, url) {
    if (!name.trim()) name = 'Mystic Link';
    if (!url.trim()) url = '#';
    const spell = {
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: 'Link Spell'
    };
    await saveSpell(spell);
    await renderSpellGrid();
    const cards = document.querySelectorAll('.spell-card');
    if (cards.length) cards[cards.length - 1].style.animation = 'spellSummon 0.7s ease-out';
  }

  // Export/Import
  async function exportGrimoire() {
    const spells = await getAllSpells();
    const exportData = { version: 3, exportDate: new Date().toISOString(), spells };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grimoire_backup_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('✨ Grimoire exported! Save this sacred tome.');
  }

  async function importGrimoire(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const spells = data.spells || [];
        for (const spell of spells) {
          const newSpell = { ...spell, id: generateId() };
          await saveSpell(newSpell);
        }
        await renderSpellGrid();
        alert(`📖 Imported ${spells.length} spells into your grimoire!`);
      } catch(err) { alert('Invalid grimoire file'); }
    };
    reader.readAsText(file);
  }

  // Initialize
  async function init() {
    await openDB();
    await renderSpellGrid();
    console.log('✨ Grimoire awakened! Spells persist forever in IndexedDB');
  }

  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();

    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const addUrlBtn = document.getElementById('addUrlBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) { alert('Select files to enchant!'); return; }
      await addFileSpell(Array.from(fileInput.files));
      fileInput.value = '';
    });

    addUrlBtn.addEventListener('click', async () => {
      const name = document.getElementById('spellName').value;
      const url = document.getElementById('spellUrl').value;
      if (!name && !url) { alert('Name your spell and provide a path!'); return; }
      await addUrlSpell(name, url);
      document.getElementById('spellName').value = '';
      document.getElementById('spellUrl').value = '';
    });

    clearAllBtn.addEventListener('click', async () => {
      if (confirm('⚠️ THIS WILL BANISH ALL SPELLS FOREVER! Continue?')) {
        await clearAllSpells();
        await renderSpellGrid();
      }
    });

    exportBtn.addEventListener('click', exportGrimoire);
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await importGrimoire(e.target.files[0]);
        importFile.value = '';
      }
    });

    // Drag and Drop
    const ritualCircle = document.querySelector('.ritual-circle');
    ritualCircle.addEventListener('dragover', (e) => { e.preventDefault(); ritualCircle.style.border = '3px solid cyan'; });
    ritualCircle.addEventListener('dragleave', () => { ritualCircle.style.border = ''; });
    ritualCircle.addEventListener('drop', async (e) => {
      e.preventDefault();
      ritualCircle.style.border = '';
      const dropped = Array.from(e.dataTransfer.files);
      if (dropped.length) await addFileSpell(dropped);
    });
  });
</script>
</body>
</html>
