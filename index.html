<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Complete Grimoire Library | Spellbook Vault 📖</title>
  <!-- Three.js + GSAP + Font Awesome -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
      color: #ffffff;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0510;
      z-index: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid #ff66cc;
      border-top: 3px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Enter Overlay - Book Cover (User adds their image) */
    .enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transform-origin: left center;
      transform-style: preserve-3d;
      background: #0a0510;
    }

    .cover-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
    }

    .cover-content {
      position: relative;
      text-align: center;
      z-index: 10;
      animation: coverFloat 2s infinite alternate;
      background: rgba(0,0,0,0.5);
      padding: 2rem;
      border-radius: 30px;
      backdrop-filter: blur(10px);
    }

    @keyframes coverFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 20px #ff44cc);}
      100% { transform: translateY(-15px); filter: drop-shadow(0 0 50px #00ffff);}
    }

    .cover-content h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 8px;
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Main Grimoire UI */
    .grimoire-ui {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      position: relative;
      z-index: 10;
    }

    .grimoire-ui.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Header */
    .book-header {
      text-align: center;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
    }

    .book-title {
      font-size: 1.3rem;
      letter-spacing: 2px;
    }

    /* Toolbar */
    .toolbar {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      border-bottom: 1px solid rgba(0,255,255,0.3);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,0,0,0.8);
      padding: 0.3rem 1rem;
      border-radius: 50px;
      border: 1px solid #ff66cc;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: white;
      padding: 0.4rem;
      outline: none;
    }

    .filter-select, .sort-select {
      background: rgba(0,0,0,0.8);
      border: 1px solid #ff66cc;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      color: white;
      cursor: pointer;
    }

    .view-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .view-btn {
      background: rgba(0,0,0,0.8);
      border: 1px solid #ff66cc;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      color: white;
      cursor: pointer;
    }

    .view-btn.active {
      background: #ff66cc;
      border-color: cyan;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.6);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff00;
      animation: pulse 1.5s infinite;
    }

    /* Page Container - Full Page Size */
    .page-container {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 1rem;
    }

    .page-container::-webkit-scrollbar {
      width: 8px;
    }
    .page-container::-webkit-scrollbar-track {
      background: #1a0f2e;
    }
    .page-container::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    /* Groups Container */
    .groups-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .group-card {
      background: rgba(20, 10, 40, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 1.2rem;
      border: 1px solid rgba(0, 255, 255, 0.4);
      animation: fadeIn 0.4s ease;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(255,102,204,0.5);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .group-title {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ffcc66, #ff66cc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .group-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Spells Grid */
    .spells-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .spell-card {
      background: linear-gradient(145deg, rgba(26, 15, 46, 0.95), rgba(10, 5, 24, 0.95));
      border-radius: 20px;
      padding: 1rem;
      border-left: 4px solid #ff66cc;
      transition: all 0.3s;
      cursor: pointer;
    }

    .spell-card:hover {
      transform: translateY(-5px);
      border-left-color: cyan;
      box-shadow: 0 0 25px cyan;
    }

    .spell-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .spell-name {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      word-break: break-word;
    }

    .spell-type-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.65rem;
      margin-bottom: 0.5rem;
    }

    .type-file { background: #00aacc; }
    .type-image { background: #7a3a9a; }
    .type-video { background: #cc6633; }
    .type-link { background: #33aa66; }
    .type-note { background: #ffaa33; }

    .spell-preview {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 0.5rem;
      max-height: 150px;
      object-fit: cover;
    }

    .spell-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .spell-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
    }

    .cast-btn { background: #00aacc; color: white; }
    .preview-btn { background: #7a3a9a; color: white; }
    .edit-btn { background: #ffaa33; color: black; }
    .delete-btn { background: #cc3366; color: white; }

    /* Add Section */
    .add-section {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      padding: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      border-top: 1px solid rgba(0, 255, 255, 0.4);
    }

    .add-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.4rem 0.8rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      font-size: 0.8rem;
    }

    select.add-input {
      min-width: 120px;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Preview Modal */
    .preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 400;
      justify-content: center;
      align-items: center;
    }

    .preview-content {
      max-width: 90%;
      max-height: 90%;
      background: #1a0f2e;
      border-radius: 30px;
      padding: 1rem;
      border: 2px solid cyan;
    }

    .preview-content img, .preview-content video, .preview-content iframe {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 20px;
    }

    .close-preview {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      cursor: pointer;
      color: white;
    }

    @media (max-width: 700px) {
      .spells-grid { grid-template-columns: 1fr; }
      .cover-content h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <p style="color:#ff66cc;">🔮 Loading Grimoire... 🔮</p>
</div>

<!-- Book Cover Overlay (User adds their image here) -->
<div class="enter-overlay" id="enterOverlay" style="display:none;">
  <img class="cover-bg" id="coverBgImg" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070" alt="Cover">
  <div class="cover-content">
    <h1>📖 COMPLETE GRIMOIRE 📖</h1>
    <p style="color:#ffccff;">✦ The Ultimate Spell Library ✦</p>
    <button class="enter-btn" id="enterBtn">🔮 OPEN THE GRIMOIRE 🔮</button>
  </div>
</div>

<!-- Main Grimoire UI -->
<div class="grimoire-ui" id="grimoireUI">
  <div class="book-header">
    <div class="book-title">⚜️ COMPLETE GRIMOIRE LIBRARY ⚜️ <span>📖✨🔮🐉⚡</span></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search spells...">
    </div>
    <select id="typeFilter" class="filter-select">
      <option value="all">All Types</option>
      <option value="file">📄 Files (HTML/JS/CSS)</option>
      <option value="image">🖼️ Images</option>
      <option value="video">🎥 Videos</option>
      <option value="link">🔗 Links</option>
      <option value="note">📝 Notes</option>
    </select>
    <select id="groupFilter" class="filter-select">
      <option value="all">All Groups</option>
    </select>
    <select id="sortSelect" class="sort-select">
      <option value="date-desc">Newest First</option>
      <option value="date-asc">Oldest First</option>
      <option value="name-asc">Name A-Z</option>
      <option value="name-desc">Name Z-A</option>
    </select>
    <div class="view-toggle">
      <button class="view-btn active" data-view="grid">📱 Grid</button>
      <button class="view-btn" data-view="list">📋 List</button>
    </div>
  </div>

  <div class="stats-bar">
    <div><span>📜</span> SPELLS: <strong id="totalSpells">0</strong></div>
    <div><span>📁</span> GROUPS: <strong id="totalGroups">0</strong></div>
    <div><span>💾</span> FILES: <strong id="fileCount">0</strong></div>
    <div class="sync-status"><span class="sync-dot"></span> <span id="syncText">Cloud Synced</span></div>
    <button id="addGroupBtn" class="magic-btn" style="background:#7a3a9a;">➕ NEW GROUP</button>
  </div>

  <!-- Page Container - Full Page Size -->
  <div class="page-container" id="pageContainer">
    <div id="groupsContainer" class="groups-container"></div>
  </div>

  <!-- Add Spell Section -->
  <div class="add-section">
    <input type="text" id="newSpellName" class="add-input" placeholder="Spell Name" style="min-width:150px;">
    <select id="spellType" class="add-input">
      <option value="file">📄 File (HTML/JS/CSS)</option>
      <option value="image">🖼️ Image</option>
      <option value="video">🎥 Video</option>
      <option value="link">🔗 Link URL</option>
      <option value="note">📝 Text Note</option>
    </select>
    <input type="file" id="fileUpload" class="add-input" style="display:none;">
    <input type="text" id="urlInput" class="add-input" placeholder="URL or Content" style="min-width:200px;">
    <select id="targetGroup" class="add-input"></select>
    <button id="addSpellBtn" class="magic-btn">✨ ADD SPELL ✨</button>
  </div>
</div>

<!-- Preview Modal -->
<div class="preview-modal" id="previewModal">
  <span class="close-preview">&times;</span>
  <div class="preview-content" id="previewContent"></div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';
  
  // Firebase Imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzGBwKCo9_dIo2_EnzBfymrBP0PwC-j9A",
    authDomain: "grimvoir-b11b4.firebaseapp.com",
    databaseURL: "https://grimvoir-b11b4-default-rtdb.firebaseio.com",
    projectId: "grimvoir-b11b4",
    storageBucket: "grimvoir-b11b4.firebasestorage.app",
    messagingSenderId: "545817815225",
    appId: "1:545817815225:web:e4dd9d9d72e3e3ec6a9368",
    measurementId: "G-QPRMEL4EXZ"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const grimoireRef = ref(database, 'complete_grimoire');

  // Data Structure
  let groups = { Default: [] };
  let currentView = 'grid';
  let searchTerm = '';
  let typeFilter = 'all';
  let groupFilter = 'all';
  let sortBy = 'date-desc';

  // 3D Background (Simplified)
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.0015);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  
  const orbGroup = new THREE.Group();
  for (let i = 0; i < 60; i++) {
    const geo = new THREE.SphereGeometry(0.08, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: [0xff66cc, 0x00ffff][i%2], emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = { radius: 2 + Math.random() * 3, speed: 0.003 + Math.random() * 0.01, angle: Math.random() * Math.PI * 2, yBase: (Math.random() - 0.5) * 3 };
    orbGroup.add(orb);
  }
  scene.add(orbGroup);
  
  const crystalGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.position.set(0, 1, 0);
  scene.add(crystal);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    crystal.rotation.y = time3d * 0.4;
    orbGroup.children.forEach((orb, i) => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.6 + d.yBase;
    });
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    renderer.render(scene, camera);
  }
  animate3d();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Helper Functions
  function getFileTypeFromName(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    if (['html', 'htm', 'js', 'css', 'xml'].includes(ext)) return 'file';
    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
    if (['mp4', 'webm', 'mov', 'avi'].includes(ext)) return 'video';
    return 'file';
  }

  function getTypeIcon(type) {
    const icons = { file: '📄', image: '🖼️', video: '🎥', link: '🔗', note: '📝' };
    return icons[type] || '🔮';
  }

  function formatDate(timestamp) {
    return new Date(timestamp).toLocaleString();
  }

  async function fileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  // Save to Firebase
  async function saveToCloud() {
    await set(grimoireRef, groups);
    document.getElementById('syncText').textContent = 'Synced';
  }

  // Load from Firebase
  async function loadFromCloud() {
    const snapshot = await get(grimoireRef);
    if (snapshot.exists()) {
      groups = snapshot.val();
    } else {
      groups = { Default: [] };
    }
    if (!groups.Default) groups.Default = [];
    updateGroupFilter();
    renderGrimoire();
  }

  // Listen to real-time changes
  function listenToCloud() {
    onValue(grimoireRef, (snapshot) => {
      if (snapshot.exists()) {
        groups = snapshot.val();
        if (!groups.Default) groups.Default = [];
        updateGroupFilter();
        renderGrimoire();
      }
    });
  }

  // Update group filter dropdown
  function updateGroupFilter() {
    const groupSelect = document.getElementById('groupFilter');
    const targetGroup = document.getElementById('targetGroup');
    const groupNames = Object.keys(groups);
    groupSelect.innerHTML = '<option value="all">All Groups</option>' + groupNames.map(g => `<option value="${g}">${g}</option>`).join('');
    targetGroup.innerHTML = groupNames.map(g => `<option value="${g}">${g}</option>`).join('');
    document.getElementById('totalGroups').textContent = groupNames.length;
  }

  // Render Grimoire
  function renderGrimoire() {
    const container = document.getElementById('groupsContainer');
    let filteredGroups = { ...groups };
    
    // Filter by group
    if (groupFilter !== 'all') {
      filteredGroups = { [groupFilter]: groups[groupFilter] || [] };
    }
    
    // Filter and sort spells in each group
    for (let groupName in filteredGroups) {
      let spells = filteredGroups[groupName];
      
      // Search filter
      if (searchTerm) {
        spells = spells.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()));
      }
      
      // Type filter
      if (typeFilter !== 'all') {
        spells = spells.filter(s => s.type === typeFilter);
      }
      
      // Sort
      spells.sort((a, b) => {
        if (sortBy === 'date-desc') return b.timestamp - a.timestamp;
        if (sortBy === 'date-asc') return a.timestamp - b.timestamp;
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
        return 0;
      });
      
      filteredGroups[groupName] = spells;
    }
    
    let html = `<div class="groups-container">`;
    for (let groupName in filteredGroups) {
      const spells = filteredGroups[groupName];
      html += `
        <div class="group-card">
          <div class="group-header">
            <span class="group-title">${getRandomEmoji()} ${escapeHtml(groupName)} (${spells.length})</span>
            <div class="group-actions">
              <button class="magic-btn" onclick="window.renameGroup('${escapeHtml(groupName)}')" style="padding:0.2rem 0.6rem;">✏️ Rename</button>
              <button class="magic-btn" onclick="window.deleteGroup('${escapeHtml(groupName)}')" style="background:#cc3366; padding:0.2rem 0.6rem;">🗑️ Delete</button>
            </div>
          </div>
          <div class="spells-grid" style="${currentView === 'list' ? 'display:block;' : ''}">
      `;
      
      for (const spell of spells) {
        if (currentView === 'list') {
          html += `<div class="spell-card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">`;
          html += `<div><span class="spell-icon">${getTypeIcon(spell.type)}</span> <strong>${escapeHtml(spell.name)}</strong> <span class="spell-type-badge type-${spell.type}">${spell.type}</span></div>`;
        } else {
          html += `<div class="spell-card">`;
          html += `<div class="spell-icon">${getTypeIcon(spell.type)}</div>`;
          html += `<div class="spell-name">${escapeHtml(spell.name)}</div>`;
          html += `<div class="spell-type-badge type-${spell.type}">${spell.type}</div>`;
          if (spell.type === 'image' && spell.content) {
            html += `<img src="${spell.content}" class="spell-preview" alt="preview">`;
          } else if (spell.type === 'video' && spell.content) {
            html += `<video src="${spell.content}" class="spell-preview" controls style="max-height:100px;"></video>`;
          } else if (spell.type === 'note' && spell.content) {
            html += `<div style="font-size:0.7rem; color:#aaa; margin-top:0.3rem;">${escapeHtml(spell.content.substring(0, 80))}${spell.content.length > 80 ? '...' : ''}</div>`;
          }
        }
        
        html += `<div class="spell-actions">
          <button class="spell-btn cast-btn" onclick="window.castSpell('${spell.id}')">⚡ CAST</button>
          <button class="spell-btn preview-btn" onclick="window.previewSpell('${spell.id}')">👁️ PREVIEW</button>
          <button class="spell-btn edit-btn" onclick="window.editSpell('${spell.id}')">✏️ EDIT</button>
          <button class="spell-btn delete-btn" onclick="window.deleteSpell('${spell.id}', '${escapeHtml(groupName)}')">🗑️ DEL</button>
        </div>`;
        html += `</div>`;
      }
      
      if (spells.length === 0) {
        html += `<div style="text-align:center; padding:2rem; color:#aaa;">No spells in this group. Add one below!</div>`;
      }
      
      html += `</div></div>`;
    }
    html += `</div>`;
    container.innerHTML = html;
    
    document.getElementById('totalSpells').textContent = Object.values(groups).flat().length;
    const fileCount = Object.values(groups).flat().filter(s => s.type === 'file').length;
    document.getElementById('fileCount').textContent = fileCount;
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }
  function getRandomEmoji() { return ['🔮', '✨', '⚡', '🔥', '💧', '🌈', '⭐', '🌙', '🐉', '🗡️'][Math.floor(Math.random() * 10)]; }

  // Global functions for buttons
  window.castSpell = async (id) => {
    for (let group in groups) {
      const spell = groups[group].find(s => s.id === id);
      if (spell) {
        if (spell.type === 'file' && spell.content) {
          const blob = await fetch(spell.content).then(r => r.blob());
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
        } else if (spell.type === 'link' && spell.content) {
          window.open(spell.content, '_blank');
        } else if (spell.type === 'image' || spell.type === 'video') {
          window.open(spell.content, '_blank');
        } else if (spell.type === 'note') {
          alert(`📝 ${spell.name}\n\n${spell.content}`);
        }
        return;
      }
    }
  };

  window.previewSpell = (id) => {
    for (let group in groups) {
      const spell = groups[group].find(s => s.id === id);
      if (spell) {
        const modal = document.getElementById('previewModal');
        const content = document.getElementById('previewContent');
        if (spell.type === 'image') content.innerHTML = `<img src="${spell.content}" alt="preview">`;
        else if (spell.type === 'video') content.innerHTML = `<video src="${spell.content}" controls autoplay></video>`;
        else if (spell.type === 'link') content.innerHTML = `<iframe src="${spell.content}" width="100%" height="70vh"></iframe>`;
        else if (spell.type === 'note') content.innerHTML = `<div style="padding:2rem;"><h3>${escapeHtml(spell.name)}</h3><p>${escapeHtml(spell.content)}</p></div>`;
        else if (spell.type === 'file') content.innerHTML = `<div style="padding:2rem;"><h3>${escapeHtml(spell.name)}</h3><p>File ready to cast. Click CAST to open.</p></div>`;
        modal.style.display = 'flex';
        return;
      }
    }
  };

  window.deleteSpell = async (id, groupName) => {
    if (confirm('Delete this spell?')) {
      groups[groupName] = groups[groupName].filter(s => s.id !== id);
      await saveToCloud();
      renderGrimoire();
    }
  };

  window.editSpell = async (id) => {
    for (let group in groups) {
      const spell = groups[group].find(s => s.id === id);
      if (spell) {
        const newName = prompt('Edit spell name:', spell.name);
        if (newName) {
          spell.name = newName;
          await saveToCloud();
          renderGrimoire();
        }
        return;
      }
    }
  };

  window.renameGroup = async (oldName) => {
    const newName = prompt('New group name:', oldName);
    if (newName && newName !== oldName) {
      groups[newName] = groups[oldName];
      delete groups[oldName];
      await saveToCloud();
      updateGroupFilter();
      renderGrimoire();
    }
  };

  window.deleteGroup = async (groupName) => {
    if (groupName === 'Default') { alert('Cannot delete Default group'); return; }
    if (confirm(`Delete group "${groupName}" and all its spells?`)) {
      delete groups[groupName];
      await saveToCloud();
      updateGroupFilter();
      renderGrimoire();
    }
  };

  // Add Spell
  document.getElementById('addSpellBtn').addEventListener('click', async () => {
    const name = document.getElementById('newSpellName').value.trim();
    const type = document.getElementById('spellType').value;
    const groupName = document.getElementById('targetGroup').value;
    const urlInput = document.getElementById('urlInput').value.trim();
    const fileInput = document.getElementById('fileUpload');
    
    if (!name) { alert('Enter spell name'); return; }
    
    let content = '';
    if (type === 'file' && fileInput.files.length) {
      content = await fileToBase64(fileInput.files[0]);
    } else if (type === 'link') {
      content = urlInput;
    } else if (type === 'note') {
      content = urlInput;
    } else if ((type === 'image' || type === 'video') && fileInput.files.length) {
      content = await fileToBase64(fileInput.files[0]);
    } else {
      content = urlInput;
    }
    
    const newSpell = {
      id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
      name: name,
      type: type,
      content: content,
      timestamp: Date.now()
    };
    
    if (!groups[groupName]) groups[groupName] = [];
    groups[groupName].push(newSpell);
    await saveToCloud();
    
    document.getElementById('newSpellName').value = '';
    document.getElementById('urlInput').value = '';
    document.getElementById('fileUpload').value = '';
    updateGroupFilter();
    renderGrimoire();
  });

  // UI Event Listeners
  document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderGrimoire(); });
  document.getElementById('typeFilter').addEventListener('change', (e) => { typeFilter = e.target.value; renderGrimoire(); });
  document.getElementById('groupFilter').addEventListener('change', (e) => { groupFilter = e.target.value; renderGrimoire(); });
  document.getElementById('sortSelect').addEventListener('change', (e) => { sortBy = e.target.value; renderGrimoire(); });
  
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.getAttribute('data-view');
      renderGrimoire();
    });
  });
  
  document.getElementById('spellType').addEventListener('change', (e) => {
    const showFile = e.target.value === 'file' || e.target.value === 'image' || e.target.value === 'video';
    document.getElementById('fileUpload').style.display = showFile ? 'inline-block' : 'none';
    document.getElementById('urlInput').style.display = (e.target.value === 'link' || e.target.value === 'note') ? 'inline-block' : 'none';
  });
  
  document.getElementById('addGroupBtn').addEventListener('click', async () => {
    const newGroup = prompt('New group name:');
    if (newGroup && !groups[newGroup]) {
      groups[newGroup] = [];
      await saveToCloud();
      updateGroupFilter();
      renderGrimoire();
    }
  });
  
  // Preview Modal Close
  document.querySelector('.close-preview').addEventListener('click', () => {
    document.getElementById('previewModal').style.display = 'none';
  });
  
  // Initialize
  async function init() {
    await loadFromCloud();
    listenToCloud();
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('enterOverlay').style.display = 'flex';
  }
  
  document.getElementById('enterBtn').addEventListener('click', () => {
    const overlay = document.getElementById('enterOverlay');
    const ui = document.getElementById('grimoireUI');
    gsap.to(overlay, { duration: 0.8, rotationY: -90, transformOrigin: "left center", ease: "power2.inOut", onComplete: () => {
      overlay.style.display = 'none';
      ui.classList.add('open');
    }});
  });
  
  init();
</script>
</body>
</html>
