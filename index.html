<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permanent VFX Library - IndexedDB Storage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0f2a 0%, #020210 100%);
      min-height: 100vh;
      color: white;
      padding: 1rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 2rem 0;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #ff66cc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .sub {
      color: #aaddff;
      margin-top: 0.5rem;
    }

    /* Storage Info */
    .storage-info {
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .badge {
      background: #00aacc;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* Add Section */
    .add-section {
      background: rgba(20, 15, 45, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(0,255,255,0.3);
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
    }

    input {
      background: rgba(0,0,0,0.7);
      border: 1px solid #00ffff;
      color: white;
      flex: 1;
      min-width: 200px;
    }

    button {
      background: linear-gradient(135deg, #1f2a5e, #0a0f30);
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px cyan;
    }

    .file-input-wrapper {
      background: rgba(0,0,0,0.7);
      border-radius: 50px;
      padding: 0.3rem 1rem;
      border: 1px solid #ff66cc;
      flex: 1;
    }

    /* File Grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .file-card {
      background: rgba(15, 10, 35, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 1rem;
      border: 1px solid rgba(0,255,255,0.3);
      transition: 0.3s;
      position: relative;
    }

    .file-card:hover {
      transform: translateY(-5px);
      border-color: #ff66cc;
      box-shadow: 0 0 20px rgba(255,0,200,0.3);
    }

    .file-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .file-name {
      font-weight: bold;
      font-size: 1.1rem;
      word-break: break-word;
      margin-bottom: 0.3rem;
    }

    .file-meta {
      font-size: 0.7rem;
      color: #aaccff;
      margin-bottom: 0.8rem;
    }

    .file-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }

    .file-actions button {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.8rem;
    }

    .btn-open { background: #00aacc; }
    .btn-delete { background: #cc3366; }
    .btn-download { background: #7a3a9a; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
    }

    /* Export/Import Section */
    .backup-section {
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 1rem;
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    @media (max-width: 700px) {
      h1 { font-size: 1.5rem; }
      .form-group { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎴 PERMANENT VFX LIBRARY 🎴</h1>
    <div class="sub">⚡ IndexedDB Storage | Files Persist Forever | Export/Import Backup ⚡</div>
  </div>

  <div class="storage-info">
    <span>📀 Storage: <strong id="storageStatus">IndexedDB Active</strong></span>
    <span>📁 Total Files: <strong id="fileCount">0</strong></span>
    <button id="clearAllBtn" style="background:#cc3366; padding:0.3rem 1rem;">🗑️ Clear All</button>
  </div>

  <div class="add-section">
    <div class="form-group">
      <div class="file-input-wrapper">
        📂 <input type="file" id="fileInput" multiple style="display:inline; width:auto; background:transparent; border:none;">
      </div>
      <button id="uploadBtn">⬆️ UPLOAD & SAVE PERMANENTLY</button>
    </div>
    
    <div class="form-group">
      <input type="text" id="urlName" placeholder="File Name (e.g., My Shader)">
      <input type="text" id="urlPath" placeholder="URL or Relative Path (e.g., ./files/shader.html)">
      <button id="addUrlBtn">🔗 ADD LINK</button>
    </div>
  </div>

  <div id="fileGrid" class="file-grid">
    <div class="empty-state">✨ Loading your grimoire... ✨</div>
  </div>

  <div class="backup-section">
    <button id="exportBtn" style="background:#2a5e3a;">💾 EXPORT ALL DATA (Backup)</button>
    <button id="importBtn" style="background:#5e3a2a;">📥 IMPORT BACKUP</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
    <span style="font-size:0.8rem; color:#aaa;">⚠️ Backup saves all files - restore on any device</span>
  </div>
</div>

<script>
  // ==================== INDEXEDDB PERMANENT STORAGE ====================
  // Ye system files ko IndexedDB mein store karega - ye localStorage se zyada permanent hai
  // aur zyada storage (usually 50MB to unlimited) allow karta hai
  
  const DB_NAME = 'VFX_Grimoire_DB';
  const DB_VERSION = 2;
  const STORE_NAME = 'files';
  
  let db = null;
  
  // Open IndexedDB
  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          store.createIndex('name', 'name', { unique: false });
          store.createIndex('timestamp', 'timestamp', { unique: false });
        }
      };
    });
  }
  
  // Save file to IndexedDB
  async function saveFile(fileData) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put(fileData);
      request.onsuccess = () => resolve(fileData);
      request.onerror = () => reject(request.error);
    });
  }
  
  // Get all files
  async function getAllFiles() {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction([STORE_NAME], 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }
  
  // Delete file
  async function deleteFile(id) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }
  
  // Clear all files
  async function clearAllFiles() {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }
  
  // Convert file to base64
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  
  // Base64 to Blob
  function base64ToBlob(base64, mimeType) {
    const byteCharacters = atob(base64);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: mimeType });
  }
  
  // Format file size
  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }
  
  // Get file icon based on extension
  function getFileIcon(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    const icons = {
      html: '🌐', htm: '🌐', css: '🎨', js: '⚡', jsx: '⚡',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', svg: '🎨',
      mp4: '🎥', webm: '🎥', mp3: '🎵', json: '🔧', pdf: '📕',
      txt: '📄', md: '📝', zip: '📦', rar: '📦'
    };
    return icons[ext] || '🎴';
  }
  
  // Generate unique ID
  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }
  
  // Render file grid
  async function renderGrid() {
    const files = await getAllFiles();
    const grid = document.getElementById('fileGrid');
    const fileCountSpan = document.getElementById('fileCount');
    
    fileCountSpan.textContent = files.length;
    
    if (files.length === 0) {
      grid.innerHTML = `<div class="empty-state">✨ No files yet! Upload or add links above ✨<br><span style="font-size:0.8rem;">Files are saved permanently in IndexedDB</span></div>`;
      return;
    }
    
    grid.innerHTML = files.map(file => `
      <div class="file-card" data-id="${file.id}">
        <div class="file-icon">${getFileIcon(file.name)}</div>
        <div class="file-name">${escapeHtml(file.name)}</div>
        <div class="file-meta">
          ${file.isFile ? `📀 ${file.sizeDisplay}` : '🔗 External Link'}<br>
          📅 ${new Date(file.timestamp).toLocaleString()}
        </div>
        <div class="file-actions">
          <button class="btn-open" onclick="window.openFile('${file.id}')">🔓 OPEN</button>
          <button class="btn-download" onclick="window.downloadFile('${file.id}')">💾 DOWNLOAD</button>
          <button class="btn-delete" onclick="window.deleteFileById('${file.id}')">🗑️ DEL</button>
        </div>
      </div>
    `).join('');
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  // Open file
  window.openFile = async (id) => {
    const files = await getAllFiles();
    const file = files.find(f => f.id === id);
    if (!file) return;
    
    if (file.isFile && file.fileBase64) {
      const blob = base64ToBlob(file.fileBase64, file.mimeType);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else if (file.urlPath) {
      window.open(file.urlPath, '_blank');
    } else {
      alert('No valid content to open');
    }
  };
  
  // Download file
  window.downloadFile = async (id) => {
    const files = await getAllFiles();
    const file = files.find(f => f.id === id);
    if (!file || !file.isFile || !file.fileBase64) {
      alert('Only uploaded files can be downloaded');
      return;
    }
    
    const blob = base64ToBlob(file.fileBase64, file.mimeType);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    URL.revokeObjectURL(url);
  };
  
  // Delete file
  window.deleteFileById = async (id) => {
    if (confirm('Delete this file permanently?')) {
      await deleteFile(id);
      await renderGrid();
    }
  };
  
  // Upload files
  async function uploadFiles(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      const fileData = {
        id: generateId(),
        name: file.name,
        size: file.size,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      };
      await saveFile(fileData);
    }
    await renderGrid();
  }
  
  // Add URL link
  async function addUrlLink(name, url) {
    if (!name.trim()) name = 'Unnamed Link';
    if (!url.trim()) url = '#';
    
    const linkData = {
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: '🔗 Link'
    };
    await saveFile(linkData);
    await renderGrid();
  }
  
  // Export all data as JSON
  async function exportData() {
    const files = await getAllFiles();
    const exportObj = {
      version: 2,
      exportDate: new Date().toISOString(),
      files: files
    };
    
    const jsonStr = JSON.stringify(exportObj, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vfx_grimoire_backup_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    alert('✨ Backup exported! Save this file safely. You can import it on any device.');
  }
  
  // Import data from JSON
  async function importData(jsonFile) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          const importedFiles = data.files || [];
          
          if (importedFiles.length === 0) {
            alert('No files found in backup');
            resolve();
            return;
          }
          
          let importedCount = 0;
          for (const file of importedFiles) {
            // Generate new ID to avoid conflicts
            const newFile = { ...file, id: generateId() };
            await saveFile(newFile);
            importedCount++;
          }
          
          await renderGrid();
          alert(`✅ Imported ${importedCount} files successfully!`);
          resolve();
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = reject;
      reader.readAsText(jsonFile);
    });
  }
  
  // Initialize
  async function init() {
    try {
      await openDB();
      await renderGrid();
      console.log('✅ IndexedDB initialized - Files will persist forever!');
    } catch (err) {
      console.error('Database error:', err);
      document.getElementById('fileGrid').innerHTML = `<div class="empty-state">⚠️ Error loading database. Your browser may not support IndexedDB.</div>`;
    }
  }
  
  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();
    
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const addUrlBtn = document.getElementById('addUrlBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    
    uploadBtn.addEventListener('click', async () => {
      if (fileInput.files.length === 0) {
        alert('Please select files to upload');
        return;
      }
      await uploadFiles(Array.from(fileInput.files));
      fileInput.value = '';
    });
    
    addUrlBtn.addEventListener('click', async () => {
      const name = document.getElementById('urlName').value;
      const url = document.getElementById('urlPath').value;
      if (!name && !url) {
        alert('Enter name and URL/path');
        return;
      }
      await addUrlLink(name, url);
      document.getElementById('urlName').value = '';
      document.getElementById('urlPath').value = '';
    });
    
    clearAllBtn.addEventListener('click', async () => {
      if (confirm('⚠️ WARNING: This will delete ALL files permanently! Continue?')) {
        await clearAllFiles();
        await renderGrid();
        alert('All files deleted.');
      }
    });
    
    exportBtn.addEventListener('click', exportData);
    
    importBtn.addEventListener('click', () => {
      importFile.click();
    });
    
    importFile.addEventListener('change', async (e) => {
      if (e.target.files.length > 0) {
        await importData(e.target.files[0]);
        importFile.value = '';
      }
    });
    
    // Drag and drop support
    const addSection = document.querySelector('.add-section');
    addSection.addEventListener('dragover', (e) => {
      e.preventDefault();
      addSection.style.border = '2px solid cyan';
    });
    addSection.addEventListener('dragleave', () => {
      addSection.style.border = 'none';
    });
    addSection.addEventListener('drop', async (e) => {
      e.preventDefault();
      addSection.style.border = 'none';
      const droppedFiles = Array.from(e.dataTransfer.files);
      if (droppedFiles.length) {
        await uploadFiles(droppedFiles);
      }
    });
  });
</script>
</body>
</html>
