<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Eternal Grimoire | 3D Spellbook with File System 📖</title>
  <!-- Three.js + GSAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Enter Overlay - Fullscreen Cover Image */
    .enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0510;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    .cover-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
    }

    .cover-content {
      position: relative;
      text-align: center;
      z-index: 10;
      animation: coverFloat 2s infinite alternate;
    }

    @keyframes coverFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 20px #ff44cc);}
      100% { transform: translateY(-15px); filter: drop-shadow(0 0 50px #00ffff);}
    }

    .cover-content h1 {
      font-size: 4rem;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 8px;
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .enter-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }

    /* Main Grimoire UI */
    .grimoire-ui {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .grimoire-ui.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Header */
    .book-header {
      text-align: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
      z-index: 20;
    }

    .book-title {
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .book-title span {
      display: inline-block;
      animation: emojiPop 1s infinite alternate;
    }

    @keyframes emojiPop {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor);}
      100% { transform: scale(1.2); filter: drop-shadow(0 0 15px currentColor);}
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 0.8rem;
      z-index: 20;
    }

    .stats-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #ffddee;
    }

    /* Page Container - Single Page View */
    .page-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Current Page */
    .current-page {
      width: 90%;
      max-width: 1200px;
      height: 70vh;
      background: rgba(20, 10, 35, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 1.5rem;
      border: 2px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 40px rgba(0,255,255,0.2);
      animation: pageEnter 0.5s ease;
      overflow-y: auto;
      position: relative;
    }

    .current-page::-webkit-scrollbar {
      width: 6px;
    }
    .current-page::-webkit-scrollbar-track {
      background: #1a0f2e;
      border-radius: 10px;
    }
    .current-page::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: scale(0.95) rotateY(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotateY(0);
      }
    }

    /* Page Background Image */
    .page-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 30px;
      opacity: 0.2;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 2;
    }

    .page-header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,102,204,0.5);
    }

    /* 4x3 Grid */
    .spells-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    /* Spell Card */
    .spell-card {
      background: linear-gradient(145deg, rgba(26, 15, 46, 0.9), rgba(10, 5, 24, 0.9));
      border-radius: 16px;
      padding: 0.8rem;
      border-left: 3px solid #ff66cc;
      transition: all 0.3s;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .spell-card:hover {
      transform: translateY(-5px);
      border-left-color: cyan;
      box-shadow: 0 0 20px cyan;
    }

    .spell-emoji {
      font-size: 2rem;
      text-align: center;
      filter: drop-shadow(0 0 8px magenta);
      animation: emojiGlow 2s infinite alternate;
    }

    @keyframes emojiGlow {
      0% { filter: drop-shadow(0 0 2px #ff44cc);}
      100% { filter: drop-shadow(0 0 15px #00ffff);}
    }

    .spell-name {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      margin: 0.5rem 0 0.3rem;
      word-break: break-word;
      color: #ffddff;
    }

    .spell-type {
      font-size: 0.6rem;
      text-align: center;
      color: #aaccff;
    }

    .spell-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .spell-btn {
      flex: 1;
      padding: 0.3rem;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.65rem;
      transition: 0.2s;
    }

    .cast-btn { background: #00aacc; color: white; }
    .cast-btn:hover { background: cyan; color: black; box-shadow: 0 0 12px cyan;}
    .rename-btn { background: #7a3a9a; color: white; }
    .delete-btn { background: #cc3366; color: white; }

    /* Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      z-index: 30;
      transition: 0.3s;
      border: 1px solid #ff66cc;
    }

    .nav-arrow:hover {
      background: rgba(0, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.1);
      border-color: cyan;
    }

    .nav-prev { left: 20px; }
    .nav-next { right: 20px; }

    /* Add Spell Section */
    .ritual-altar {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      border-top: 1px solid rgba(0, 255, 255, 0.4);
      z-index: 20;
    }

    .ancient-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      flex: 1;
      min-width: 140px;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px cyan;
    }

    @media (max-width: 900px) {
      .spells-grid { grid-template-columns: repeat(3, 1fr); }
      .current-page { width: 95%; height: 65vh; padding: 1rem; }
      .nav-arrow { width: 40px; height: 40px; font-size: 1.5rem; }
    }
    @media (max-width: 600px) {
      .spells-grid { grid-template-columns: repeat(2, 1fr); }
      .book-title { font-size: 1rem; }
      .cover-content h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Enter Overlay with Fullscreen Cover Image -->
<div class="enter-overlay" id="enterOverlay">
  <img class="cover-bg" id="coverBgImg" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070" alt="Cover Background">
  <div class="cover-content">
    <h1>📖 GRIMOIRE OF ETERNAL SPELLS 📖</h1>
    <button class="enter-btn" id="enterBtn">🔮 OPEN THE GRIMOIRE 🔮</button>
  </div>
</div>

<!-- Main Grimoire UI -->
<div class="grimoire-ui" id="grimoireUI">
  <div class="book-header">
    <div class="book-title">
      <span>⚜️</span> CODEX MAGICUS <span>📖</span> <span>✨</span> <span>🔮</span> <span>⚡</span> <span>🐉</span>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stats-item"><span>📜</span> SPELLS: <strong id="totalSpells">0</strong></div>
    <div class="stats-item"><span>📖</span> PAGE: <strong id="currentPageNum">1</strong> / <strong id="totalPages">1</strong></div>
    <div class="stats-item"><span>💾</span> FILES: <strong id="fileCount">0</strong> saved</div>
    <button id="clearAllBtn" class="magic-btn" style="background:#a03366; padding:0.3rem 0.8rem;">💀 PURGE</button>
    <button id="exportBtn" class="magic-btn" style="background:#2a5e3a; padding:0.3rem 0.8rem;">💾 EXPORT</button>
    <button id="importBtn" class="magic-btn" style="background:#5e3a2a; padding:0.3rem 0.8rem;">📥 IMPORT</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
  </div>

  <!-- Page Container with Navigation -->
  <div class="page-container">
    <div class="nav-arrow nav-prev" id="prevPage">◀</div>
    <div class="current-page" id="currentPage">
      <img class="page-bg-img" id="pageBgImg" src="https://images.unsplash.com/photo-1538370965046-79c0d6907d47?q=80&w=2069" alt="Page Background">
      <div class="page-content" id="pageContent"></div>
    </div>
    <div class="nav-arrow nav-next" id="nextPage">▶</div>
  </div>

  <!-- Add Spell Section -->
  <div class="ritual-altar">
    <input type="file" id="fileInput" multiple style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.4rem 0.8rem; color:white; font-size:0.8rem;">
    <button id="uploadBtn" class="magic-btn">✨ ENCHANT FILE ✨</button>
    <input type="text" id="spellName" class="ancient-input" placeholder="Spell Name">
    <input type="text" id="spellUrl" class="ancient-input" placeholder="URL or Path">
    <button id="addUrlBtn" class="magic-btn">🔗 FORGE LINK</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';

  // ==================== 3D MAGICAL BACKGROUND ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.0015);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0xff44cc, 0.5);
  backLight.position.set(-3, 2, -6);
  scene.add(backLight);
  const magicLight = new THREE.PointLight(0x44aaff, 0.7);
  magicLight.position.set(4, 3, 4);
  scene.add(magicLight);

  // Floating Orbs
  const orbGroup = new THREE.Group();
  const orbs = [];
  for (let i = 0; i < 80; i++) {
    const geo = new THREE.SphereGeometry(0.08, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: [0xff66cc, 0x00ffff, 0xffaa44][i%3], emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = {
      radius: 1.5 + Math.random() * 3.5,
      speed: 0.002 + Math.random() * 0.015,
      angle: Math.random() * Math.PI * 2,
      yBase: (Math.random() - 0.5) * 4
    };
    orbGroup.add(orb);
    orbs.push(orb);
  }
  scene.add(orbGroup);

  // Central Crystal
  const crystalGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133, roughness: 0.2, metalness: 0.8 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.castShadow = true;
  crystal.position.set(0, 1, 0);
  scene.add(crystal);

  // Rings
  const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const ring2Geo = new THREE.TorusGeometry(1.5, 0.04, 64, 200);
  const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.z = Math.PI / 3;
  scene.add(ring2);

  // Particles
  const particleCount = 1500;
  const particleGeo = new THREE.BufferGeometry();
  const particlePos = [];
  for (let i = 0; i < particleCount; i++) {
    particlePos.push((Math.random() - 0.5) * 250);
    particlePos.push((Math.random() - 0.5) * 120);
    particlePos.push((Math.random() - 0.5) * 100 - 50);
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlePos), 3));
  const particleMat = new THREE.PointsMaterial({ color: 0xffaaff, size: 0.06 });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    
    crystal.rotation.y = time3d * 0.4;
    ring.rotation.z += 0.007;
    ring2.rotation.x += 0.005;
    ring2.rotation.y += 0.006;
    
    orbs.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.6 + d.yBase;
    });
    
    particles.rotation.y += 0.0003;
    magicLight.intensity = 0.5 + Math.sin(time3d) * 0.3;
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    
    renderer.render(scene, camera);
  }
  animate3d();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== INDEXEDDB STORAGE (PERMANENT) ====================
  const DB_NAME = 'Grimoire_Spellbook_DB_v2';
  const DB_VERSION = 7;
  const STORE_NAME = 'spells';
  let db = null;
  let spells = [];
  let currentPage = 0;
  let totalPages = 1;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function saveSpell(spellData) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(spellData);
      request.onsuccess = () => resolve(spellData);
      request.onerror = () => reject(request.error);
    });
  }

  async function getAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteSpell(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function clearAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function getRandomEmoji() {
    const emojis = ['🔮', '✨', '⚡', '🔥', '💧', '🌪️', '❄️', '🌈', '⭐', '🌙', '💀', '👁️', '🐉', '🗡️', '🛡️', '📜', '🎴', '🌀', '💫', '🌟', '🎭', '🔱', '⚜️'];
    return emojis[Math.floor(Math.random() * emojis.length)];
  }

  // Render Current Page
  async function renderCurrentPage() {
    spells = await getAllSpells();
    const spellsPerPage = 12;
    totalPages = Math.max(1, Math.ceil(spells.length / spellsPerPage));
    if (currentPage >= totalPages) currentPage = totalPages - 1;
    if (currentPage < 0) currentPage = 0;
    
    document.getElementById('totalSpells').textContent = spells.length;
    document.getElementById('totalPages').textContent = totalPages;
    document.getElementById('currentPageNum').textContent = currentPage + 1;
    
    const start = currentPage * spellsPerPage;
    const pageSpells = spells.slice(start, start + spellsPerPage);
    const pageNum = currentPage + 1;
    
    let html = `
      <div class="page-header-info">
        <span class="page-number">📖 Page ${pageNum} of ${totalPages}</span>
        <span class="page-decoration">${getRandomEmoji()} ${getRandomEmoji()} ${getRandomEmoji()}</span>
      </div>
      <div class="spells-grid">
    `;
    
    for (const spell of pageSpells) {
      const spellEmoji = getRandomEmoji();
      html += `
        <div class="spell-card" data-id="${spell.id}">
          <div class="spell-emoji">${spellEmoji}</div>
          <div class="spell-name">${escapeHtml(spell.name.length > 25 ? spell.name.substring(0, 22) + '...' : spell.name)}</div>
          <div class="spell-type">${spell.isFile ? `📀 ${spell.sizeDisplay}` : '🔗 Link Spell'}</div>
          <div class="spell-actions">
            <button class="spell-btn cast-btn" data-action="cast" data-id="${spell.id}">⚡ CAST</button>
            <button class="spell-btn rename-btn" data-action="rename" data-id="${spell.id}">✏️ RENAME</button>
            <button class="spell-btn delete-btn" data-action="delete" data-id="${spell.id}">🗑️ DEL</button>
          </div>
        </div>
      `;
    }
    
    const remaining = spellsPerPage - pageSpells.length;
    for (let i = 0; i < remaining; i++) {
      html += `<div class="spell-card" style="opacity:0.5;"><div class="spell-emoji">📖</div><div class="spell-name">Empty Slot</div><div class="spell-type">Awaiting Spell...</div><div class="spell-actions"><button class="spell-btn" disabled style="background:#444;">—</button></div></div>`;
    }
    
    html += `</div>`;
    
    document.getElementById('pageContent').innerHTML = html;
    
    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const spell = spells.find(s => s.id === id);
        if (spell) {
          gsap.to(btn.closest('.spell-card'), { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
          if (spell.isFile && spell.fileBase64) {
            const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } else if (spell.urlPath) {
            window.open(spell.urlPath, '_blank');
          } else alert('No spell content!');
        }
      });
    });
    
    document.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const newName = prompt('✏️ Rename your spell:', spells.find(s => s.id === id)?.name);
        if (newName && newName.trim()) {
          const spell = spells.find(s => s.id === id);
          if (spell) {
            spell.name = newName.trim();
            await saveSpell(spell);
            await renderCurrentPage();
          }
        }
      });
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Dispel this spell?')) {
          const id = btn.getAttribute('data-id');
          await deleteSpell(id);
          await renderCurrentPage();
        }
      });
    });
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Navigation
  function nextPage() {
    if (currentPage + 1 < totalPages) {
      currentPage++;
      renderCurrentPage();
      gsap.fromTo('.current-page', { scale: 0.95, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.4 });
    }
  }
  
  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderCurrentPage();
      gsap.fromTo('.current-page', { scale: 0.95, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.4 });
    }
  }

  // Add File Spell
  async function addFileSpell(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      const spell = {
        id: generateId(),
        name: file.name,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      };
      await saveSpell(spell);
    }
    await renderCurrentPage();
    document.getElementById('fileCount').textContent = (await getAllSpells()).filter(s => s.isFile).length;
  }

  // Add URL Spell
  async function addUrlSpell(name, url) {
    if (!name.trim()) name = 'Mystic Link';
    if (!url.trim()) url = '#';
    const spell = {
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: 'Link Spell'
    };
    await saveSpell(spell);
    await renderCurrentPage();
  }

  // Export/Import
  async function exportGrimoire() {
    const allSpells = await getAllSpells();
    const exportData = { version: 7, exportDate: new Date().toISOString(), spells: allSpells };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grimoire_backup_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('📖 Grimoire exported!');
  }

  async function importGrimoire(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const importedSpells = data.spells || [];
        for (const spell of importedSpells) {
          const newSpell = { ...spell, id: generateId() };
          await saveSpell(newSpell);
        }
        await renderCurrentPage();
        alert(`✨ Imported ${importedSpells.length} spells!`);
      } catch(err) { alert('Invalid file'); }
    };
    reader.readAsText(file);
  }

  // Enter Animation
  const enterOverlay = document.getElementById('enterOverlay');
  const grimoireUI = document.getElementById('grimoireUI');
  const enterBtn = document.getElementById('enterBtn');
  
  enterBtn.addEventListener('click', () => {
    gsap.to(enterOverlay, {
      duration: 0.8,
      rotationY: -90,
      transformOrigin: "left center",
      ease: "power2.inOut",
      onComplete: () => {
        enterOverlay.style.display = 'none';
        grimoireUI.classList.add('open');
        gsap.fromTo('.current-page', { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, delay: 0.2 });
      }
    });
  });

  // Initialize
  async function init() {
    await openDB();
    await renderCurrentPage();
    document.getElementById('fileCount').textContent = (await getAllSpells()).filter(s => s.isFile).length;
    console.log('📖 Grimoire Ready! Files saved permanently in IndexedDB.');
  }

  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();
    
    document.getElementById('prevPage').addEventListener('click', prevPage);
    document.getElementById('nextPage').addEventListener('click', nextPage);
    
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const addUrlBtn = document.getElementById('addUrlBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const spellName = document.getElementById('spellName');
    const spellUrl = document.getElementById('spellUrl');
    
    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) { alert('Select files to enchant!'); return; }
      await addFileSpell(Array.from(fileInput.files));
      fileInput.value = '';
    });
    
    addUrlBtn.addEventListener('click', async () => {
      const name = spellName.value;
      const url = spellUrl.value;
      if (!name && !url) { alert('Name and path required!'); return; }
      await addUrlSpell(name, url);
      spellName.value = '';
      spellUrl.value = '';
    });
    
    clearAllBtn.addEventListener('click', async () => {
      if (confirm('⚠️ Banish ALL spells? This is permanent!')) {
        await clearAllSpells();
        await renderCurrentPage();
        document.getElementById('fileCount').textContent = 0;
      }
    });
    
    exportBtn.addEventListener('click', exportGrimoire);
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await importGrimoire(e.target.files[0]);
        importFile.value = '';
        document.getElementById('fileCount').textContent = (await getAllSpells()).filter(s => s.isFile).length;
      }
    });
    
    const altar = document.querySelector('.ritual-altar');
    altar.addEventListener('dragover', (e) => { e.preventDefault(); altar.style.border = '2px solid cyan'; });
    altar.addEventListener('dragleave', () => { altar.style.border = ''; });
    altar.addEventListener('drop', async (e) => {
      e.preventDefault();
      altar.style.border = '';
      const dropped = Array.from(e.dataTransfer.files);
      if (dropped.length) await addFileSpell(dropped);
    });
  });
</script>
</body>
</html>
