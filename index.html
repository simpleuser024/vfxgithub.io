<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Customizable Grimoire | 3D Spellbook Library 📖</title>
  <!-- Three.js + GSAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
      color: white;
    }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

    /* Main Container */
    .app-container { position: relative; z-index: 10; width: 100%; height: 100vh; display: flex; flex-direction: column; }

    /* Customizable Cover Page */
    .cover-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .cover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }
    .cover-content {
      position: relative;
      z-index: 2;
      animation: coverFloat 2s infinite alternate;
    }
    @keyframes coverFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 20px #ff44cc);}
      100% { transform: translateY(-15px); filter: drop-shadow(0 0 50px #00ffff);}
    }
    .cover-content h1 {
      font-size: 3.5rem;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 8px;
    }
    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .enter-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px cyan; }

    /* Customize Panel */
    .customize-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1rem;
      z-index: 250;
      border: 1px solid #ff66cc;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 200px;
    }
    .customize-panel input, .customize-panel button {
      padding: 0.3rem;
      border-radius: 20px;
      border: none;
      background: #1a0f2e;
      color: white;
    }
    .customize-panel button { background: #ff66cc; cursor: pointer; }

    /* Main UI */
    .grimoire-ui {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    .grimoire-ui.open { opacity: 1; pointer-events: auto; }

    /* Tabs */
    .custom-tabs {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255,102,204,0.5);
      flex-wrap: wrap;
      z-index: 20;
    }
    .tab-btn {
      background: rgba(20,10,40,0.8);
      border: 1px solid #ff66cc;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .tab-btn.active { background: linear-gradient(135deg, #ff66cc, #00ffff); border-color: cyan; box-shadow: 0 0 15px cyan; }

    /* Content Area */
    .main-content { flex: 1; overflow-y: auto; padding: 1rem; position: relative; }
    .main-content::-webkit-scrollbar { width: 6px; }
    .main-content::-webkit-scrollbar-track { background: #1a0f2e; border-radius: 10px; }
    .main-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ff66cc, #00ffff); border-radius: 10px; }

    .page-view { display: none; animation: fadeIn 0.4s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: rgba(0,0,0,0.5);
      padding: 0.8rem;
      border-radius: 30px;
      align-items: center;
    }
    .search-input, .filter-select, .sort-select {
      background: rgba(0,0,0,0.7);
      border: 1px solid #ff66cc;
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      color: white;
      flex: 1;
    }
    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .magic-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px cyan; }

    /* Spells Grid */
    .spells-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .spell-card {
      background: linear-gradient(145deg, rgba(26,15,46,0.9), rgba(10,5,24,0.9));
      border-radius: 20px;
      padding: 1rem;
      border-left: 4px solid #ff66cc;
      transition: 0.3s;
      cursor: pointer;
    }
    .spell-card:hover { transform: translateY(-5px); border-left-color: cyan; box-shadow: 0 0 25px cyan; }
    .spell-emoji { font-size: 2rem; text-align: center; }
    .spell-name { font-size: 0.9rem; font-weight: bold; text-align: center; margin: 0.5rem 0; color: white; }
    .spell-preview img, .spell-preview video { max-width: 100%; max-height: 80px; border-radius: 10px; }
    .spell-actions { display: flex; gap: 0.3rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .spell-btn { flex: 1; padding: 0.3rem; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
    .cast-btn { background: #00aacc; color: white; }
    .preview-btn { background: #7a3a9a; color: white; }
    .delete-btn { background: #cc3366; color: white; }

    /* Groups */
    .group-card {
      background: linear-gradient(145deg, rgba(40,20,60,0.9), rgba(20,10,40,0.9));
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ff66cc;
    }
    .group-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .group-name { font-size: 1.2rem; font-weight: bold; color: #ffccff; }
    .group-spells { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .group-spell-tag { background: #2a1a5e; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.8rem; }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.3s;
    }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { max-width: 90%; max-height: 90%; background: #1a0f2e; border-radius: 20px; padding: 1rem; }
    .modal-close { float: right; font-size: 1.5rem; cursor: pointer; }
    .modal-preview { max-width: 100%; max-height: 70vh; }

    /* Last Cover Page */
    .last-cover {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      padding: 0.5rem;
      text-align: center;
      z-index: 15;
      font-size: 0.7rem;
    }

    @media (max-width: 700px) {
      .cover-content h1 { font-size: 1.8rem; }
      .customize-panel { bottom: 10px; right: 10px; min-width: 160px; }
      .spells-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<!-- Customizable Cover Page -->
<div id="coverPage" class="cover-page" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070');">
  <div class="cover-overlay"></div>
  <div class="cover-content">
    <h1 id="coverTitle">📖 ETERNAL GRIMOIRE 📖</h1>
    <p id="coverSubtitle">✦ The Ultimate Spell Library ✦</p>
    <button class="enter-btn" id="enterGrimoireBtn">🔮 OPEN THE GRIMOIRE 🔮</button>
  </div>
</div>

<!-- Customize Panel -->
<div class="customize-panel">
  <h4 style="font-size:0.8rem;">🎨 Customize Cover</h4>
  <input type="text" id="coverBgUrl" placeholder="Background Image URL" value="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070">
  <input type="text" id="coverTitleInput" placeholder="Cover Title" value="📖 ETERNAL GRIMOIRE 📖">
  <input type="text" id="coverSubtitleInput" placeholder="Subtitle" value="✦ The Ultimate Spell Library ✦">
  <button id="applyCoverBtn">Apply Cover</button>
  <button id="resetCoverBtn">Reset Cover</button>
</div>

<!-- Main Grimoire UI -->
<div class="grimoire-ui" id="grimoireUI">
  <div class="custom-tabs">
    <button class="tab-btn active" data-tab="spells">🔮 Spells</button>
    <button class="tab-btn" data-tab="groups">📁 Groups</button>
    <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
  </div>

  <div class="main-content">
    <!-- Spells Tab -->
    <div id="spellsTab" class="page-view active">
      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search spells...">
        <select id="filterType" class="filter-select">
          <option value="all">All Types</option>
          <option value="file">📁 Files</option>
          <option value="url">🔗 Links</option>
          <option value="image">🖼️ Images</option>
          <option value="video">🎥 Videos</option>
          <option value="html">🌐 HTML</option>
        </select>
        <select id="sortBy" class="sort-select">
          <option value="name">Sort by Name</option>
          <option value="date">Sort by Date</option>
        </select>
      </div>
      <div style="display: flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
        <input type="file" id="fileInput" multiple style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.3rem; color:white;">
        <button id="uploadBtn" class="magic-btn">✨ Upload File</button>
        <input type="text" id="spellName" placeholder="Spell Name" style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.3rem;">
        <input type="text" id="spellUrl" placeholder="URL" style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.3rem;">
        <button id="addUrlBtn" class="magic-btn">🔗 Add Link</button>
        <button id="newGroupQuickBtn" class="magic-btn">📁 New Group</button>
      </div>
      <div id="spellsGrid" class="spells-grid"></div>
    </div>

    <!-- Groups Tab -->
    <div id="groupsTab" class="page-view">
      <div class="toolbar">
        <input type="text" id="groupSearch" class="search-input" placeholder="🔍 Search groups...">
        <button id="newGroupBtn" class="magic-btn">📁 Create Group</button>
      </div>
      <div id="groupsContainer"></div>
    </div>

    <!-- Settings Tab -->
    <div id="settingsTab" class="page-view">
      <div class="toolbar">
        <button id="exportBtn" class="magic-btn">💾 Export All Data</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
        <button id="importBtn" class="magic-btn">📥 Import Data</button>
        <button id="clearAllBtn" class="magic-btn" style="background:#a03366;">🗑️ Clear All</button>
      </div>
      <div style="background:rgba(0,0,0,0.5); border-radius:20px; padding:1rem; margin-top:1rem;">
        <h3>📊 Statistics</h3>
        <p>Total Spells: <strong id="statSpells">0</strong></p>
        <p>Total Groups: <strong id="statGroups">0</strong></p>
        <p>Files Stored: <strong id="statFiles">0</strong></p>
      </div>
      <div style="margin-top:1rem;">
        <h3>🎨 Page Background</h3>
        <input type="text" id="pageBgUrl" class="search-input" placeholder="Page Background Image URL">
        <button id="applyPageBgBtn" class="magic-btn">Apply to Spells Page</button>
        <button id="resetPageBgBtn" class="magic-btn">Reset</button>
      </div>
    </div>
  </div>
</div>

<div class="last-cover">
  <span>✨ The Grimoire holds infinite possibilities | Customizable Cover | Made with Magic ✨</span>
</div>

<!-- Preview Modal -->
<div id="previewModal" class="modal">
  <div class="modal-content">
    <span class="modal-close" id="closeModal">&times;</span>
    <div id="modalPreview"></div>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';

  // ==================== 3D BACKGROUND ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.0015);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lights and Objects
  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const magicLight = new THREE.PointLight(0x44aaff, 0.7);
  magicLight.position.set(4, 3, 4);
  scene.add(magicLight);

  const orbGroup = new THREE.Group();
  for (let i = 0; i < 60; i++) {
    const geo = new THREE.SphereGeometry(0.08, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: [0xff66cc, 0x00ffff, 0xffaa44][i%3], emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = { radius: 1.5 + Math.random() * 3, speed: 0.002 + Math.random() * 0.01, angle: Math.random() * Math.PI * 2, yBase: (Math.random() - 0.5) * 3 };
    orbGroup.add(orb);
  }
  scene.add(orbGroup);
  
  const crystalGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.position.set(0, 1, 0);
  scene.add(crystal);
  
  const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    crystal.rotation.y = time3d * 0.4;
    ring.rotation.z += 0.007;
    orbGroup.children.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.6 + d.yBase;
    });
    magicLight.intensity = 0.5 + Math.sin(time3d) * 0.3;
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    renderer.render(scene, camera);
  }
  animate3d();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== DATA STORAGE ====================
  let spells = [];
  let groups = [];
  
  function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
  
  function saveData() {
    localStorage.setItem('grimoire_spells_v2', JSON.stringify(spells));
    localStorage.setItem('grimoire_groups_v2', JSON.stringify(groups));
    updateStats();
  }
  
  function loadData() {
    const savedSpells = localStorage.getItem('grimoire_spells_v2');
    const savedGroups = localStorage.getItem('grimoire_groups_v2');
    if (savedSpells) spells = JSON.parse(savedSpells);
    if (savedGroups) groups = JSON.parse(savedGroups);
    if (!spells.length) {
      spells = [
        { id: generateId(), name: "Fireball", type: "url", urlPath: "https://example.com", emoji: "🔥", createdAt: Date.now() },
        { id: generateId(), name: "Ice Storm", type: "url", urlPath: "https://example.com", emoji: "❄️", createdAt: Date.now() }
      ];
    }
    if (!groups.length) {
      groups = [{ id: generateId(), name: "Elemental Magic", spellIds: [spells[0]?.id].filter(Boolean) }];
    }
    updateStats();
  }
  
  function updateStats() {
    document.getElementById('statSpells').textContent = spells.length;
    document.getElementById('statGroups').textContent = groups.length;
    document.getElementById('statFiles').textContent = spells.filter(s => s.type === 'file').length;
  }
  
  function getFileType(file) {
    if (file.type?.startsWith('image/')) return 'image';
    if (file.type?.startsWith('video/')) return 'video';
    if (file.name?.endsWith('.html')) return 'html';
    return 'file';
  }
  
  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }
  
  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  
  async function addFileSpell(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        const fileType = getFileType(file);
        spells.push({
          id: generateId(),
          name: file.name,
          type: fileType,
          fileBase64: base64,
          mimeType: file.type,
          size: file.size,
          createdAt: Date.now(),
          emoji: fileType === 'image' ? '🖼️' : fileType === 'video' ? '🎥' : fileType === 'html' ? '🌐' : '📁'
        });
        saveData();
        renderSpells();
        resolve();
      };
      reader.readAsDataURL(file);
    });
  }
  
  function addUrlSpell(name, url) {
    spells.push({
      id: generateId(),
      name: name.trim(),
      type: 'url',
      urlPath: url.trim(),
      createdAt: Date.now(),
      emoji: '🔗'
    });
    saveData();
    renderSpells();
  }
  
  function renderSpells() {
    let filtered = [...spells];
    const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
    const filterType = document.getElementById('filterType')?.value || 'all';
    const sortBy = document.getElementById('sortBy')?.value || 'name';
    
    if (search) filtered = filtered.filter(s => s.name.toLowerCase().includes(search));
    if (filterType !== 'all') filtered = filtered.filter(s => s.type === filterType);
    filtered.sort((a, b) => sortBy === 'name' ? a.name.localeCompare(b.name) : (b.createdAt||0) - (a.createdAt||0));
    
    const grid = document.getElementById('spellsGrid');
    if (!filtered.length) { grid.innerHTML = '<div style="text-align:center; padding:2rem;">✨ No spells found ✨</div>'; return; }
    
    grid.innerHTML = filtered.map(spell => `
      <div class="spell-card" data-id="${spell.id}">
        <div class="spell-emoji">${spell.emoji || '🔮'}</div>
        <div class="spell-name">${escapeHtml(spell.name)}</div>
        <div class="spell-preview">${spell.type === 'image' && spell.fileBase64 ? `<img src="data:${spell.mimeType};base64,${spell.fileBase64}" alt="preview">` : spell.type === 'video' && spell.fileBase64 ? `<video src="data:${spell.mimeType};base64,${spell.fileBase64}" style="max-height:60px;"></video>` : ''}</div>
        <div class="spell-actions">
          <button class="spell-btn cast-btn" data-id="${spell.id}">⚡ Cast</button>
          <button class="spell-btn preview-btn" data-id="${spell.id}">👁️ Preview</button>
          <button class="spell-btn delete-btn" data-id="${spell.id}">🗑️ Del</button>
        </div>
      </div>
    `).join('');
    
    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.dataset.id;
        const spell = spells.find(s => s.id === id);
        if (spell.type === 'url') window.open(spell.urlPath, '_blank');
        else if (spell.fileBase64) {
          const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
      });
    });
    document.querySelectorAll('.preview-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const spell = spells.find(s => s.id === id);
        const modal = document.getElementById('previewModal');
        const modalPreview = document.getElementById('modalPreview');
        if (spell.type === 'image' && spell.fileBase64) modalPreview.innerHTML = `<img src="data:${spell.mimeType};base64,${spell.fileBase64}" class="modal-preview">`;
        else if (spell.type === 'video' && spell.fileBase64) modalPreview.innerHTML = `<video src="data:${spell.mimeType};base64,${spell.fileBase64}" controls class="modal-preview"></video>`;
        else if (spell.urlPath) modalPreview.innerHTML = `<iframe src="${spell.urlPath}" style="width:80vw; height:60vh;"></iframe>`;
        else modalPreview.innerHTML = `<p>No preview available</p>`;
        modal.classList.add('active');
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Delete this spell?')) {
          spells = spells.filter(s => s.id !== btn.dataset.id);
          groups.forEach(g => g.spellIds = g.spellIds.filter(id => id !== btn.dataset.id));
          saveData();
          renderSpells();
          renderGroups();
        }
      });
    });
  }
  
  function renderGroups() {
    const container = document.getElementById('groupsContainer');
    const search = document.getElementById('groupSearch')?.value.toLowerCase() || '';
    let filtered = groups.filter(g => g.name.toLowerCase().includes(search));
    container.innerHTML = filtered.map(group => `
      <div class="group-card">
        <div class="group-header">
          <span class="group-name">📁 ${escapeHtml(group.name)}</span>
          <div>
            <button class="magic-btn add-to-group" data-id="${group.id}" style="padding:0.2rem 0.6rem;">+ Add Spell</button>
            <button class="magic-btn rename-group" data-id="${group.id}" style="padding:0.2rem 0.6rem;">✏️</button>
            <button class="magic-btn delete-group" data-id="${group.id}" style="padding:0.2rem 0.6rem; background:#a03366;">🗑️</button>
          </div>
        </div>
        <div class="group-spells">
          ${group.spellIds.map(sid => { const s = spells.find(sp => sp.id === sid); return s ? `<span class="group-spell-tag">${s.emoji} ${escapeHtml(s.name)}</span>` : ''; }).join('') || '<span style="color:#aaa;">No spells</span>'}
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.add-to-group').forEach(btn => {
      btn.addEventListener('click', () => {
        const groupId = btn.dataset.id;
        const spellList = spells.map((s, i) => `${i+1}. ${s.name} (${s.id.substring(0,8)})`).join('\n');
        const choice = prompt(`Select spell number to add:\n${spellList}\n\nEnter spell number:`);
        const idx = parseInt(choice) - 1;
        if (!isNaN(idx) && spells[idx]) {
          const group = groups.find(g => g.id === groupId);
          if (!group.spellIds.includes(spells[idx].id)) group.spellIds.push(spells[idx].id);
          saveData();
          renderGroups();
        }
      });
    });
    document.querySelectorAll('.rename-group').forEach(btn => {
      btn.addEventListener('click', () => {
        const newName = prompt('New group name:');
        if (newName) { groups.find(g => g.id === btn.dataset.id).name = newName; saveData(); renderGroups(); }
      });
    });
    document.querySelectorAll('.delete-group').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Delete this group?')) { groups = groups.filter(g => g.id !== btn.dataset.id); saveData(); renderGroups(); }
      });
    });
  }
  
  // Initialize and Event Listeners
  loadData();
  renderSpells();
  renderGroups();
  
  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
      document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
      if (btn.dataset.tab === 'groups') renderGroups();
    });
  });
  
  // Upload handlers
  document.getElementById('uploadBtn')?.addEventListener('click', async () => {
    const input = document.getElementById('fileInput');
    if (input?.files.length) { for (const f of input.files) await addFileSpell(f); input.value = ''; }
  });
  document.getElementById('addUrlBtn')?.addEventListener('click', () => {
    const name = document.getElementById('spellName')?.value;
    const url = document.getElementById('spellUrl')?.value;
    if (name && url) addUrlSpell(name, url);
    else alert('Enter name and URL');
  });
  document.getElementById('newGroupBtn')?.addEventListener('click', () => {
    const name = prompt('Group name:');
    if (name) { groups.push({ id: generateId(), name, spellIds: [] }); saveData(); renderGroups(); }
  });
  document.getElementById('newGroupQuickBtn')?.addEventListener('click', () => {
    const name = prompt('Group name:');
    if (name) { groups.push({ id: generateId(), name, spellIds: [] }); saveData(); renderGroups(); }
  });
  
  // Search/Filter
  document.getElementById('searchInput')?.addEventListener('input', () => renderSpells());
  document.getElementById('filterType')?.addEventListener('change', () => renderSpells());
  document.getElementById('sortBy')?.addEventListener('change', () => renderSpells());
  document.getElementById('groupSearch')?.addEventListener('input', () => renderGroups());
  
  // Export/Import
  document.getElementById('exportBtn')?.addEventListener('click', () => {
    const data = { spells, groups, version: 2 };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `grimoire_backup_${Date.now()}.json`;
    a.click();
  });
  document.getElementById('importBtn')?.addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile')?.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.spells) spells = data.spells;
          if (data.groups) groups = data.groups;
          saveData();
          renderSpells();
          renderGroups();
          alert('Import successful!');
        } catch(err) { alert('Invalid file'); }
      };
      reader.readAsText(file);
    }
  });
  document.getElementById('clearAllBtn')?.addEventListener('click', () => {
    if (confirm('⚠️ Delete ALL spells and groups?')) { spells = []; groups = []; saveData(); renderSpells(); renderGroups(); }
  });
  
  // Page Background
  document.getElementById('applyPageBgBtn')?.addEventListener('click', () => {
    const url = document.getElementById('pageBgUrl').value;
    if (url) document.getElementById('spellsTab').style.background = `url(${url}) center/cover no-repeat fixed`;
  });
  document.getElementById('resetPageBgBtn')?.addEventListener('click', () => {
    document.getElementById('spellsTab').style.background = '';
  });
  
  // Cover Customization
  const coverPage = document.getElementById('coverPage');
  const coverTitle = document.getElementById('coverTitle');
  const coverSubtitle = document.getElementById('coverSubtitle');
  document.getElementById('applyCoverBtn')?.addEventListener('click', () => {
    const bgUrl = document.getElementById('coverBgUrl').value;
    const title = document.getElementById('coverTitleInput').value;
    const subtitle = document.getElementById('coverSubtitleInput').value;
    if (bgUrl) coverPage.style.backgroundImage = `url(${bgUrl})`;
    coverTitle.textContent = title;
    coverSubtitle.textContent = subtitle;
  });
  document.getElementById('resetCoverBtn')?.addEventListener('click', () => {
    coverPage.style.backgroundImage = "url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070')";
    coverTitle.textContent = "📖 ETERNAL GRIMOIRE 📖";
    coverSubtitle.textContent = "✦ The Ultimate Spell Library ✦";
  });
  
  // Enter Grimoire
  const grimoireUI = document.getElementById('grimoireUI');
  document.getElementById('enterGrimoireBtn')?.addEventListener('click', () => {
    gsap.to(coverPage, { duration: 0.8, scale: 0.9, opacity: 0, onComplete: () => {
      coverPage.style.display = 'none';
      grimoireUI.classList.add('open');
    }});
  });
  
  // Modal close
  document.getElementById('closeModal')?.addEventListener('click', () => document.getElementById('previewModal').classList.remove('active'));
  document.getElementById('previewModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('previewModal')) document.getElementById('previewModal').classList.remove('active'); });
</script>
</body>
</html>
