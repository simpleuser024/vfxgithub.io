<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Eternal Grimoire | 3D Spellbook with File Storage 📖</title>
  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', 'Orbitron', monospace;
      overflow: hidden;
      background: #0a0510;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Custom Image Cover Overlay */
    .book-cover-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0510;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: left center;
      transform-style: preserve-3d;
    }

    .cover-image-container {
      position: relative;
      width: 80%;
      max-width: 500px;
      text-align: center;
      animation: coverFloat 2s infinite alternate;
    }

    @keyframes coverFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 20px #ff44cc);}
      100% { transform: translateY(-15px); filter: drop-shadow(0 0 50px #00ffff);}
    }

    .cover-image-container img {
      width: 100%;
      border-radius: 30px;
      border: 3px solid;
      border-image: linear-gradient(135deg, #ff66cc, #00ffff) 1;
      box-shadow: 0 0 60px rgba(0,255,255,0.3);
    }

    .cover-text {
      margin-top: 2rem;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ffcc44, #ff66cc, #00ffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 4px;
    }

    .enter-btn {
      margin-top: 1.5rem;
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: 2px solid #ff66cc;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .enter-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
      border-color: cyan;
    }

    /* Main Grimoire UI */
    .grimoire-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, rgba(10, 5, 25, 0.6), rgba(0, 0, 0, 0.8));
      backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .grimoire-container.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Book Header with Emojis */
    .book-header {
      text-align: center;
      padding: 1rem;
      background: rgba(20, 10, 40, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
    }

    .book-title {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: white;
    }

    .book-title span {
      display: inline-block;
      animation: emojiPop 1s infinite alternate;
    }

    @keyframes emojiPop {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor);}
      100% { transform: scale(1.2); filter: drop-shadow(0 0 15px currentColor);}
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
      background: rgba(0, 0, 0, 0.5);
      margin: 0.5rem 1rem;
      border-radius: 60px;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .stats-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color:white;
    }

    /* Book Pages - Flip Book Style */
    .book-pages-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 2rem;
      position: relative;
    }

    .book-pages-wrapper::-webkit-scrollbar {
      width: 8px;
    }
    .book-pages-wrapper::-webkit-scrollbar-track {
      background: #1a0f2e;
      border-radius: 10px;
    }
    .book-pages-wrapper::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ff66cc, #00ffff);
      border-radius: 10px;
    }

    /* Page Styling - Book Page */
    .book-page {
      background: rgba(30, 20, 55, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      margin-bottom: 2rem;
      padding: 1.5rem;
      border: 1px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: pageFlipIn 0.6s ease-out;
    }

    @keyframes pageFlipIn {
      0% {
        transform: rotateY(-90deg);
        opacity: 0;
      }
      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(255, 102, 204, 0.5);
    }

    .page-number {
      font-size: 1rem;
      color: #ffaaee;
      font-family: monospace;
    }

    .page-decoration {
      font-size: 1.2rem;
    }

    /* 4x3 Grid Layout - 12 Spells per Page */
    .spells-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    /* Spell Card */
    .spell-card {
      background: linear-gradient(145deg, #1a0f2e, #0a0518);
      border-radius: 16px;
      padding: 0.8rem;
      border-left: 3px solid #ff66cc;
      border-right: 1px solid #00ffff;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      animation: cardGlow 3s infinite alternate;
      cursor: pointer;
    }

    @keyframes cardGlow {
      0% { border-left-color: #ff66cc; box-shadow: 0 0 5px rgba(255,102,204,0.3);}
      100% { border-left-color: #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.4);}
    }

    .spell-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-left-color: cyan;
      box-shadow: 0 0 25px cyan;
    }

    .spell-emoji {
      font-size: 2rem;
      text-align: center;
      filter: drop-shadow(0 0 8px magenta);
      animation: emojiGlow 2s infinite alternate;
    }

    @keyframes emojiGlow {
      0% { filter: drop-shadow(0 0 2px #ff44cc); transform: scale(1);}
      100% { filter: drop-shadow(0 0 15px #00ffff); transform: scale(1.05);}
    }

    .spell-name {
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      margin: 0.5rem 0 0.3rem;
      word-break: break-word;
      color: #ffddff;
    }

    .spell-type {
      font-size: 0.6rem;
      text-align: center;
      color: #aaccff;
      font-family: monospace;
    }

    .spell-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .spell-btn {
      flex: 1;
      padding: 0.3rem;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.65rem;
      transition: 0.2s;
    }

    .cast-btn { background: #00aacc; color: white; }
    .cast-btn:hover { background: cyan; color: black; box-shadow: 0 0 12px cyan;}
    .delete-btn { background: #cc3366; color: white; }

    /* Last Page - Custom Image */
    .last-page {
      background: linear-gradient(135deg, rgba(30, 20, 55, 0.95), rgba(20, 10, 45, 0.95));
      text-align: center;
      padding: 2rem;
    }

    .last-page img {
      max-width: 80%;
      border-radius: 20px;
      border: 2px solid #ff66cc;
      margin: 1rem 0;
    }

    /* Add Spell Section */
    .ritual-altar {
      background: rgba(20, 10, 40, 0.85);
      backdrop-filter: blur(16px);
      padding: 0.8rem 1.2rem;
      margin: 0 1rem 1rem 1rem;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      border: 1px solid rgba(0, 255, 255, 0.4);
    }

    .ancient-input {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff66cc;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      color: white;
      font-family: monospace;
      flex: 1;
      min-width: 140px;
    }

    .magic-btn {
      background: linear-gradient(145deg, #2a1a5e, #120a30);
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px cyan;
    }

    @media (max-width: 900px) {
      .spells-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .spells-grid { grid-template-columns: repeat(2, 1fr); }
      .book-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Book Cover with Custom Image -->
<div class="book-cover-overlay" id="bookCover">
  <div class="cover-image-container">
    <!-- You can replace this image URL with your own image -->
    <img id="coverImage" src="image.png" alt="Grimoire Cover">
    <div class="cover-text">📖 GRIMOIRE OF SPELLS 📖</div>
    <button class="enter-btn" id="enterBtn">🔮 OPEN THE BOOK 🔮</button>
  </div>
</div>

<!-- Main Grimoire UI -->
<div class="grimoire-container" id="grimoireContainer">
  <div class="book-header">
    <div class="book-title">
      <span>⚜️</span> CODEX MAGICUS <span>📖</span> <span>✨</span> <span>🔮</span> <span>⚡</span>
    </div>
    <div style="font-size: 0.7rem;">✦ Each page holds 12 spells (4x3 grid) | Pages grow automatically ✦</div>
  </div>

  <div class="stats-bar">
    <div class="stats-item"><span>📜</span> SPELLS: <strong id="totalSpells">0</strong></div>
    <div class="stats-item"><span>📖</span> PAGES: <strong id="totalPages">0</strong></div>
    <div class="stats-item"><span>💾</span> STORAGE: <strong id="storageStatus">IndexedDB</strong></div>
    <button id="clearAllBtn" class="magic-btn" style="background:#a03366; padding:0.3rem 1rem;">💀 PURGE ALL</button>
    <button id="exportBtn" class="magic-btn" style="background:#2a5e3a; padding:0.3rem 1rem;">💾 EXPORT</button>
    <button id="importBtn" class="magic-btn" style="background:#5e3a2a; padding:0.3rem 1rem;">📥 IMPORT</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
  </div>

  <!-- Book Pages Wrapper -->
  <div class="book-pages-wrapper" id="bookPagesWrapper">
    <div id="pagesContainer"></div>
  </div>

  <!-- Ritual Altar -->
  <div class="ritual-altar">
    <input type="file" id="fileInput" multiple style="background:#0a0520; border:1px solid #ff66cc; border-radius:50px; padding:0.4rem 0.8rem; color:white; font-size:0.8rem;">
    <button id="uploadBtn" class="magic-btn">✨ ENCHANT FILE ✨</button>
    <input type="text" id="spellName" class="ancient-input" placeholder="Spell Name">
    <input type="text" id="spellUrl" class="ancient-input" placeholder="URL or Path">
    <button id="addUrlBtn" class="magic-btn">🔗 FORGE LINK</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';

  // ==================== 3D MAGICAL BACKGROUND ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050210);
  scene.fog = new THREE.FogExp2(0x050210, 0.0015);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 16);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0x331144);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
  mainLight.position.set(5, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0xff44cc, 0.5);
  backLight.position.set(-3, 2, -6);
  scene.add(backLight);
  const magicLight = new THREE.PointLight(0x44aaff, 0.7);
  magicLight.position.set(4, 3, 4);
  scene.add(magicLight);

  // Floating Magic Orbs with Emoji Colors
  const orbGroup = new THREE.Group();
  const orbs = [];
  const colors = [0xff66cc, 0x00ffff, 0xffaa44, 0xaa66ff];
  for (let i = 0; i < 60; i++) {
    const geo = new THREE.SphereGeometry(0.1, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], emissive: 0x331133 });
    const orb = new THREE.Mesh(geo, mat);
    orb.userData = {
      radius: 1.5 + Math.random() * 3,
      speed: 0.002 + Math.random() * 0.01,
      angle: Math.random() * Math.PI * 2,
      yBase: (Math.random() - 0.5) * 4
    };
    orbGroup.add(orb);
    orbs.push(orb);
  }
  scene.add(orbGroup);

  // Central Crystal
  const crystalGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xff44aa, emissive: 0x441133, roughness: 0.2, metalness: 0.8 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.castShadow = true;
  crystal.position.set(0, 1, 0);
  scene.add(crystal);

  // Rings
  const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 64, 200);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const ring2Geo = new THREE.TorusGeometry(1.5, 0.04, 64, 200);
  const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.z = Math.PI / 3;
  scene.add(ring2);

  // Particles System (3D Emojis effect)
  const particleCount = 800;
  const particleGeo = new THREE.BufferGeometry();
  const particlePos = [];
  for (let i = 0; i < particleCount; i++) {
    particlePos.push((Math.random() - 0.5) * 200);
    particlePos.push((Math.random() - 0.5) * 100);
    particlePos.push((Math.random() - 0.5) * 80 - 40);
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlePos), 3));
  const particleMat = new THREE.PointsMaterial({ color: 0xffaaff, size: 0.07 });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  let time3d = 0;
  function animate3d() {
    requestAnimationFrame(animate3d);
    time3d += 0.012;
    
    crystal.rotation.y = time3d * 0.4;
    crystal.rotation.x = Math.sin(time3d * 0.6) * 0.2;
    ring.rotation.z += 0.007;
    ring2.rotation.x += 0.005;
    ring2.rotation.y += 0.006;
    
    orbs.forEach(orb => {
      const d = orb.userData;
      d.angle += d.speed;
      orb.position.x = Math.cos(d.angle) * d.radius;
      orb.position.z = Math.sin(d.angle) * d.radius;
      orb.position.y = Math.sin(d.angle * 1.5) * 0.6 + d.yBase;
    });
    
    particles.rotation.y += 0.0005;
    particles.rotation.x += 0.0003;
    magicLight.intensity = 0.5 + Math.sin(time3d) * 0.3;
    
    camera.position.x += (Math.sin(time3d * 0.1) * 0.1 - camera.position.x) * 0.02;
    camera.lookAt(0, 1, 0);
    
    renderer.render(scene, camera);
  }
  animate3d();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== INDEXEDDB STORAGE (PERMANENT) ====================
  const DB_NAME = 'Grimoire_Spellbook_DB';
  const DB_VERSION = 6;
  const STORE_NAME = 'spells';
  let db = null;
  let spells = [];

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  async function saveSpell(spellData) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(spellData);
      request.onsuccess = () => resolve(spellData);
      request.onerror = () => reject(request.error);
    });
  }

  async function getAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteSpell(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function clearAllSpells() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_NAME], 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNums)], { type: mime || 'application/octet-stream' });
  }

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function getRandomEmoji() {
    const emojis = ['🔮', '✨', '⚡', '🔥', '💧', '🌪️', '❄️', '🌈', '⭐', '🌙', '💀', '👁️', '🐉', '🗡️', '🛡️', '📜', '🎴', '🌀', '💫', '🌟'];
    return emojis[Math.floor(Math.random() * emojis.length)];
  }

  // Render Book Pages - 4x3 Grid (12 spells per page)
  async function renderBook() {
    spells = await getAllSpells();
    const totalSpellsSpan = document.getElementById('totalSpells');
    const totalPagesSpan = document.getElementById('totalPages');
    totalSpellsSpan.textContent = spells.length;
    
    const spellsPerPage = 12;
    const pageCount = Math.ceil(spells.length / spellsPerPage);
    totalPagesSpan.textContent = pageCount || 1;
    
    const pagesContainer = document.getElementById('pagesContainer');
    
    let html = '';
    
    // Normal Pages
    for (let pageIdx = 0; pageIdx < pageCount; pageIdx++) {
      const start = pageIdx * spellsPerPage;
      const pageSpells = spells.slice(start, start + spellsPerPage);
      const pageNum = pageIdx + 1;
      
      html += `<div class="book-page" data-page="${pageIdx}">
        <div class="page-header">
          <span class="page-number">📖 Page ${pageNum} • ${pageSpells.length} Spells</span>
          <span class="page-decoration">${getRandomEmoji()} ${getRandomEmoji()} ${getRandomEmoji()}</span>
        </div>
        <div class="spells-grid" id="page-${pageIdx}">
      `;
      
      for (const spell of pageSpells) {
        const spellEmoji = getRandomEmoji();
        html += `
          <div class="spell-card" data-id="${spell.id}">
            <div class="spell-emoji">${spellEmoji}</div>
            <div class="spell-name">${escapeHtml(spell.name.length > 25 ? spell.name.substring(0, 22) + '...' : spell.name)}</div>
            <div class="spell-type">${spell.isFile ? `📀 ${spell.sizeDisplay}` : '🔗 Link Spell'}</div>
            <div class="spell-actions">
              <button class="spell-btn cast-btn" data-action="cast" data-id="${spell.id}">⚡ CAST</button>
              <button class="spell-btn delete-btn" data-action="delete" data-id="${spell.id}">🗑️ DEL</button>
            </div>
          </div>
        `;
      }
      
      // Fill empty slots if any
      const remaining = spellsPerPage - pageSpells.length;
      for (let i = 0; i < remaining; i++) {
        html += `<div class="spell-card" style="opacity:0.5; border-left-color:#444;"><div class="spell-emoji">📖</div><div class="spell-name">Empty Page</div><div class="spell-type">Awaiting Spell...</div><div class="spell-actions"><button class="spell-btn" disabled style="background:#444;">—</button></div></div>`;
      }
      
      html += `</div></div>`;
    }
    
    // Last Page with Custom Image
    html += `<div class="book-page last-page">
      <div class="page-header">
        <span class="page-number">📖 Final Page • The End</span>
        <span class="page-decoration">✨ 🌟 ⭐</span>
      </div>
      <div style="text-align:center;">
        <img id="lastPageImage" src="image.png" alt="Grimoire End" style="max-width:80%; border-radius:20px; margin:1rem 0;">
        <p style="color:#ffaaee;">✦ The Grimoire holds infinite possibilities ✦</p>
        <p style="font-size:0.8rem;">Add more spells to create new pages...</p>
      </div>
    </div>`;
    
    pagesContainer.innerHTML = html;
    
    // Attach events
    document.querySelectorAll('.cast-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const spell = spells.find(s => s.id === id);
        if (spell) {
          const card = btn.closest('.spell-card');
          gsap.to(card, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
          
          if (spell.isFile && spell.fileBase64) {
            const blob = base64ToBlob(spell.fileBase64, spell.mimeType);
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } else if (spell.urlPath) {
            window.open(spell.urlPath, '_blank');
          } else alert('No spell content to cast!');
        }
      });
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Dispel this spell from the grimoire?')) {
          const id = btn.getAttribute('data-id');
          await deleteSpell(id);
          await renderBook();
        }
      });
    });
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Add File Spell
  async function addFileSpell(files) {
    for (const file of files) {
      const base64 = await fileToBase64(file);
      const spell = {
        id: generateId(),
        name: file.name,
        sizeDisplay: formatSize(file.size),
        mimeType: file.type,
        fileBase64: base64,
        isFile: true,
        timestamp: Date.now()
      };
      await saveSpell(spell);
    }
    await renderBook();
    const wrapper = document.getElementById('bookPagesWrapper');
    wrapper.scrollTop = wrapper.scrollHeight;
  }

  // Add URL Spell
  async function addUrlSpell(name, url) {
    if (!name.trim()) name = 'Mystic Link';
    if (!url.trim()) url = '#';
    const spell = {
      id: generateId(),
      name: name.trim(),
      urlPath: url.trim(),
      isFile: false,
      timestamp: Date.now(),
      sizeDisplay: 'Link Spell'
    };
    await saveSpell(spell);
    await renderBook();
    const wrapper = document.getElementById('bookPagesWrapper');
    wrapper.scrollTop = wrapper.scrollHeight;
  }

  // Export/Import
  async function exportGrimoire() {
    const allSpells = await getAllSpells();
    const exportData = { version: 6, exportDate: new Date().toISOString(), spells: allSpells };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grimoire_backup_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('📖 Grimoire exported!');
  }

  async function importGrimoire(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const importedSpells = data.spells || [];
        for (const spell of importedSpells) {
          const newSpell = { ...spell, id: generateId() };
          await saveSpell(newSpell);
        }
        await renderBook();
        alert(`✨ Imported ${importedSpells.length} spells!`);
      } catch(err) { alert('Invalid grimoire file'); }
    };
    reader.readAsText(file);
  }

  // Enter Animation
  const bookCover = document.getElementById('bookCover');
  const grimoireContainer = document.getElementById('grimoireContainer');
  const enterBtn = document.getElementById('enterBtn');
  
  enterBtn.addEventListener('click', () => {
    gsap.to(bookCover, {
      duration: 0.8,
      rotationY: -90,
      transformOrigin: "left center",
      ease: "power2.inOut",
      onComplete: () => {
        bookCover.style.display = 'none';
        grimoireContainer.classList.add('open');
        gsap.fromTo('.book-page', 
          { rotationY: -90, opacity: 0 },
          { rotationY: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: "back.out(1.2)" }
        );
      }
    });
  });

  // Initialize
  async function init() {
    await openDB();
    await renderBook();
    console.log('📖 Grimoire Ready! Spells persist forever.');
  }

  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();
    
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const addUrlBtn = document.getElementById('addUrlBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const spellName = document.getElementById('spellName');
    const spellUrl = document.getElementById('spellUrl');
    
    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) { alert('Select files to enchant!'); return; }
      await addFileSpell(Array.from(fileInput.files));
      fileInput.value = '';
    });
    
    addUrlBtn.addEventListener('click', async () => {
      const name = spellName.value;
      const url = spellUrl.value;
      if (!name && !url) { alert('Name your spell and provide a path!'); return; }
      await addUrlSpell(name, url);
      spellName.value = '';
      spellUrl.value = '';
    });
    
    clearAllBtn.addEventListener('click', async () => {
      if (confirm('⚠️ This will banish ALL spells! Continue?')) {
        await clearAllSpells();
        await renderBook();
      }
    });
    
    exportBtn.addEventListener('click', exportGrimoire);
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await importGrimoire(e.target.files[0]);
        importFile.value = '';
      }
    });
    
    const altar = document.querySelector('.ritual-altar');
    altar.addEventListener('dragover', (e) => { e.preventDefault(); altar.style.border = '3px solid cyan'; });
    altar.addEventListener('dragleave', () => { altar.style.border = ''; });
    altar.addEventListener('drop', async (e) => {
      e.preventDefault();
      altar.style.border = '';
      const dropped = Array.from(e.dataTransfer.files);
      if (dropped.length) await addFileSpell(dropped);
    });
  });
</script>
</body>
</html>
